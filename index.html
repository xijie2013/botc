/* ---------- seat-view guest ops ---------- */
function addGuest(){
  const inp=document.getElementById("nameInput"); const name=inp.value.trim(); if(!name) return;
  if(!guests.includes(name)) guests.push(name);
  if(!tokens.some(t=>t.name===name)) tokens.push({id:++uid,name,seat:null,dead:false});
  inp.value=""; inp.focus(); render();
}
function reAdd(name){ if(tokens.some(t=>t.name===name)) return; tokens.push({id:++uid,name,seat:null,dead:false}); render(); }
function removeToken(id){ tokens=tokens.filter(t=>t.id!==id); if(selected===id) selected=null; render(); }
function forgetGuest(name){ guests=guests.filter(g=>g!==name); tokens=tokens.filter(t=>t.name!==name); try{ if(window._stDelAccount) window._stDelAccount(name); }catch(e){} render(); }
function setCount(d){ N=Math.max(5,Math.min(15,N+d)); customDist=null; tokens.forEach(t=>{if(t.seat!==null&&t.seat>=N)t.seat=null;}); ensureMeta(); render(); }
async function shuffle(){ if(!await uiConfirm("确定随机排座？将打乱当前所有座位安排。")) return; const order=tokens.slice();
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  tokens.forEach(t=>t.seat=null); order.forEach((t,i)=>{if(i<N)t.seat=i;}); render(); }
async function clearSeats(){ if(!await uiConfirm("确定清空所有座位？")) return; tokens.forEach(t=>t.seat=null); render(); }
function moveToken(id,seat){ const tok=tokens.find(t=>t.id===id); if(!tok)return;
  if(seat!==null){ const occ=tokens.find(t=>t.seat===seat); if(occ&&occ.id!==id) occ.seat=tok.seat; } tok.seat=seat; }
function dropOn(seat,e){ const id=+e.dataTransfer.getData("text"); moveToken(id,seat); selected=null; render(); }
function seatClick(i){ if(selected!==null){ moveToken(selected,i); selected=null; render(); return; } const t=seatToken(i); if(t){ selected=t.id; render(); } }
function toggleDead(i){ const wasDead=isDeadSeat(i);
  const t=seatToken(i); if(t){ t.dead=!t.dead; } else { ensureMeta(); meta[i].dead=!meta[i].dead; }
  const nowDead=isDeadSeat(i);
  if(nowDead&&!wasDead) demonDied(i); else if(!nowDead&&wasDead) demonRevived(i);
  render(); }
function togglePoison(i){ ensureMeta(); meta[i].poison=!meta[i].poison; render(); }
function toggleDrunk(i){ ensureMeta(); meta[i].drunk=!meta[i].drunk; render(); }

/* ---------- grimoire ops ---------- */
async function dealRoles(){
  const base=customDist||DIST[N]; if(!base) return;
  if(base.reduce((a,b)=>a+b,0)!==N){ await uiAlert('各阵营数量合计与人数（'+N+'）不符，请调整后再发牌。'); return; }
  if(!await uiConfirm("确定随机发牌？将重新分配所有身份。")) return;
  ensureMeta(); night=1; impKills={}; poisonPicks={}; monkPicks={}; ftPicks={}; butlerPicks={}; pingPicks={}; ravenPicks={}; undertakerPicks={}; sickAns={}; nominations={}; executions={}; virginUsed=false; slayerShot=null; redHerring=-1;
  Object.keys(nightChecks).forEach(k=>delete nightChecks[k]);   // 清空每夜勾选
  const pick=(team,k)=>{ const pool=ROLES.filter(r=>r.team===team&&!lockedRoles.has(r.id)).map(r=>r.id);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    return pool.slice(0,Math.max(0,k)); };
  // 先定爪牙/恶魔，再按设置期能力（男爵）调整好人构成
  const mins=pick("min",base[2]), dems=pick("dem",base[3]);
  let tfN=base[0], outN=base[1];
  if(mins.includes("baron")){ const s=Math.min(2,tfN); tfN-=s; outN+=s; }   // 男爵：外来者+2、镇民−2（最多2+2=4，正好等于外来者总数）
  let chosen=[...pick("tf",tfN),...pick("out",outN),...mins,...dems];
  for(let i=chosen.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[chosen[i],chosen[j]]=[chosen[j],chosen[i]];}
  meta.forEach((m,i)=>{ m.role=chosen[i]||null; m.poison=false; m.drunk=false; m.hist={}; m.info=""; m._swSeat=null; m._swPrevRole=null; m.isDrunk=false; });
  tokens.forEach(t=>t.dead=false);
  // 酒鬼：把「酒鬼」这张牌换成「自以为是的某镇民」，并打上永久受损标记
  const dSeat=meta.findIndex(m=>m.role==="drunk");
  if(dSeat>=0){ const used=new Set(meta.map(m=>m.role).filter(Boolean));
    const pool=ROLES.filter(r=>r.team==="tf"&&!used.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
    meta[dSeat].role = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null; meta[dSeat].isDrunk=true; meta[dSeat].drunk=true; }
  // 给恶魔随机 3 个伪装（不在场的好人角色）；酒鬼的真身是"酒鬼"，其自以为的镇民并不在场，可作伪装
  const inSet=new Set(meta.map(m=> m && (m.isDrunk?'drunk':m.role)).filter(Boolean));
  const goodPool=ROLES.filter(r=>(r.team==="tf"||r.team==="out")&&!inSet.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
  for(let i=goodPool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[goodPool[i],goodPool[j]]=[goodPool[j],goodPool[i]];}
  bluffs=[goodPool[0]||"", goodPool[1]||"", goodPool[2]||""];
  // 本局速览混淆镇民：男爵 +2；恶魔伪装里每含 1 个外来者再 +1，避免一眼看出伪装含外来者
  overviewDecoys=[]; refreshOverviewDecoys();
  // 红鲱鱼：随机一名好人（非恶魔、非占卜师本人），会被占卜师读为恶魔
  if(chosen.includes("fortuneteller")){
    const goodSeats=[]; meta.forEach((m,i)=>{ if(m.role && !isEvil(RMAP[m.role].team) && m.role!=="fortuneteller") goodSeats.push(i); });
    if(goodSeats.length) redHerring=goodSeats[Math.floor(Math.random()*goodSeats.length)];
  }
  render();
}
async function resetRoles(){ if(!await uiConfirm("重置所有身份、状态、备注、伪装？（保留名字与座位）")) return;
  meta=Array.from({length:N},blankMeta); night=1; bluffs=["","",""]; impKills={}; poisonPicks={}; monkPicks={}; ftPicks={}; butlerPicks={}; pingPicks={}; ravenPicks={}; undertakerPicks={}; sickAns={}; nominations={}; executions={}; virginUsed=false; slayerShot=null; redHerring=-1;
  Object.keys(nightChecks).forEach(k=>delete nightChecks[k]); overviewDecoys=[]; tokens.forEach(t=>t.dead=false); render(); }
function setBluff(k,v){ bluffs[k]=v; refreshOverviewDecoys(); render(); }

/* ---------- 夜晚信息自动计算 ---------- */
function seatAlive(i){ const t=seatToken(i), m=meta[i]||{}; return !(t?t.dead:m.dead); }
function seatEvil(i){ const m=meta[i]; return !!(m&&m.role&&isEvil(RMAP[m.role].team)); }
/* 判定阵营（含间谍/陌客误判）：间谍可判善良、陌客可判邪恶，其余按真实阵营 */
function effReg(i){ const m=meta[i]; if(!m||!m.role) return 'good';
  if(m.reg==='good'||m.reg==='evil') return m.reg;
  if(m.role==='spy') return 'good';        // 间谍默认判善良
  if(m.role==='recluse') return 'evil';    // 陌客默认判邪恶
  return isEvil(RMAP[m.role].team)?'evil':'good'; }
function regEvil(i){ return effReg(i)==='evil'; }
function setReg(i,v){ ensureMeta(); meta[i].reg=v; render(); }
function setRedHerring(v){ redHerring = v===""? -1 : +v; render(); }
function setDrunk(v){ const prev=meta.findIndex(m=>m&&m.isDrunk); if(prev>=0){ meta[prev].isDrunk=false; meta[prev].drunk=false; }
  if(v!==""){ ensureMeta(); meta[+v].isDrunk=true; meta[+v].drunk=true; } render(); }
function teamSeats(team){ const r=[]; meta.forEach((m,i)=>{ if(m.role&&RMAP[m.role].team===team) r.push(i); }); return r; }
function nameAt(i){ const t=seatToken(i); return t?esc(t.name):('座位'+(i+1)); }
function nearestLiving(i,dir){ for(let s=1;s<N;s++){ const j=((i+dir*s)%N+N)%N; if(j===i) break; if(seatAlive(j)) return j; } return -1; }
function computeNightInfo(id){
  const seats=[]; meta.forEach((m,i)=>{ if(m.role===id) seats.push(i); }); if(!seats.length) return "";
  const i=seats[0], m=meta[i];
  if(isDeadSeat(i)) return '<span class="ninfo-warn">✝ 已出局，不再行动</span>';
  const warn=(m.poison||m.drunk)?'<span class="ninfo-warn">⚠中毒/醉酒 · 信息不可靠（可真可假，由你定）</span>':'';
  const label=(team)=>teamSeats(team).map(j=>nameAt(j)+'＝'+RMAP[meta[j].role].name);
  if(id==="chef"){ return warn+'相邻邪恶对数：<b>'+chefPairs()+'</b>'; }
  if(id==="empath"){ return warn+'两侧存活邻座邪恶数：<b>'+empathNum(i)+'</b>'; }
  if(id==="washerwoman"){ const t=label("tf"); return warn+'镇民候选：'+(t.join('、')||'无')+'（选其一+任意一名玩家）'; }
  if(id==="librarian"){ const o=label("out"); return warn+(o.length?'外来者：'+o.join('、')+'（选其一+任意一名玩家）':'无外来者 → 告知“没有外来者”'); }
  if(id==="investigator"){
    const cand=[]; meta.forEach((mm,j)=>{ if(!mm.role) return; const tm=RMAP[mm.role].team;
      if(tm==="min" && effReg(j)!=="good") cand.push(nameAt(j)+'＝'+RMAP[mm.role].name);
      else if(mm.role==="recluse" && effReg(j)==="evil") cand.push(nameAt(j)+'＝陌客(判为爪牙)'); });
    return warn+(cand.length?'爪牙候选：'+cand.join('、')+'（选其一+任意一名玩家）':'无可判定爪牙'); }
  if(id==="fortuneteller"){
    const d=[]; meta.forEach((mm,j)=>{ if(!mm.role) return;
      if(RMAP[mm.role].team==="dem") d.push(nameAt(j));
      else if(mm.role==="recluse" && effReg(j)==="evil") d.push(nameAt(j)+'(陌客可读为恶魔)'); });
    return warn+'读为恶魔：'+(d.join('、')||'无')+'　红鲱鱼另设一名好人；所选2人含其一则答“是”'; }
  if(id==="undertaker"){ const ex=executions[night-1];
    if(ex===undefined) return warn+'昨日尚未记录处决';
    if(ex<0) return warn+'昨日无人被处决 → 无信息';
    const tr=meta[ex]?(meta[ex].isDrunk?'drunk':meta[ex].role):null;   // 酒鬼真身=酒鬼
    return warn+'昨日处决：'+nameAt(ex)+' → '+(tr&&RMAP[tr]?RMAP[tr].name:'（未分配）'); }
  if(id==="spy"){ return warn+'查看魔典（知晓全部身份与状态）　注意：间谍可被判定为好人 / 镇民 / 外来者'; }
  return warn;
}
/* 夜间信息录入：勾选夜间顺序的某一步 → 记录该角色本夜信息；取消勾选 → 删除该条 */
/* 每晚记录按来源标签分条存储：hist[night]={evil,info,kill,death,role}，兼容旧的字符串格式 */
function histSet(seat,tag,text){
  if(seat<0||!meta[seat]) return;
  if(!meta[seat].hist) meta[seat].hist={};
  const h=meta[seat].hist;
  if(typeof h[night]==="string") h[night]={info:h[night]};   // 旧数据兼容
  if(!h[night]) h[night]={};
  if(text==null||text==="") delete h[night][tag]; else h[night][tag]=text;
  if(Object.keys(h[night]).length===0) delete h[night];
}
const PICKERS=new Set(["fortuneteller","washerwoman","librarian","investigator","ravenkeeper","undertaker","chef","empath"]);
function recordStep(roleId,on){
  const idx=meta.findIndex(m=>m&&m.role===roleId); if(idx<0) return;
  if(roleId==="washerwoman"||roleId==="librarian"||roleId==="investigator"){
    const r=on?pingResult(roleId):null;   // 勾选时把当前答案记入日志（含“没有外来者/爪牙”这类无需选人的自动结果）
    histSet(idx,'info', r?r.text:null); return;
  }
  if(PICKERS.has(roleId)) return;   // 其余选择器角色由各自的选择器记录实际结果
  histSet(idx,'info', on?computeNightInfo(roleId):null);
}
function recordSpecial(sid,on){
  const mins=teamSeats("min"), dem=teamSeats("dem");
  if(sid==="_minion"){
    const txt='爪牙互认：'+(mins.map(nameAt).join('、')||'无')+'　恶魔：'+(dem.map(nameAt).join('、')||'无');
    mins.forEach(i=>histSet(i,'evil', on?txt:null));
  } else if(sid==="_demon"){
    const bl=bluffs.filter(Boolean).map(id=>RMAP[id]?RMAP[id].name:'').filter(Boolean);
    const txt='爪牙：'+(mins.map(nameAt).join('、')||'无')+'　伪装：'+(bl.join('、')||'（未设）');
    dem.forEach(i=>histSet(i,'evil', on?txt:null));
  }
}
function stepNight(d){ night=Math.max(1,night+d); render(); }

/* ---------- 小恶魔夜间击杀 / 自杀转移 ---------- */
function isDeadSeat(i){ const t=seatToken(i); return t?!!t.dead:!!(meta[i]&&meta[i].dead); }
function killSeat(i,dead){ const t=seatToken(i); if(t) t.dead=dead; else { ensureMeta(); meta[i].dead=dead; } }
function livingSeats(){ const r=[]; for(let i=0;i<N;i++) if(!isDeadSeat(i)) r.push(i); return r; }
function allSeats(){ const r=[]; for(let i=0;i<N;i++) r.push(i); return r; }   // 含已出局，用于可选全体的能力/提名/投票
function countAlive(){ return livingSeats().length; }
function impSeat(){ let dead=-1; for(let i=0;i<N;i++){ if(meta[i]&&meta[i].role==="imp"){ if(!isDeadSeat(i)) return i; dead=i; } } return dead; }

/* ---------- 投毒者夜间下毒 ---------- */
function poisonerSeat(){ return meta.findIndex(m=>m&&m.role==="poisoner"); }
function poisonPick(v){
  const pz=poisonerSeat();
  Object.keys(poisonPicks).forEach(k=>{ const s=poisonPicks[k]; if(meta[s]) meta[s].poison=false; }); // 旧毒在下次行动前失效（历史保留）
  const prev=poisonPicks[night];
  if(prev!=null){ histSet(pz,'poison',null); histSet(prev,'poisoned',null); }   // 撤销本夜记录
  if(v===""){ delete poisonPicks[night]; reResolveKill(); render(); return; }
  const t=+v;
  poisonPicks[night]=t; meta[t].poison=true;
  histSet(pz,'poison','下毒 '+nameAt(t));
  histSet(t,'poisoned','被投毒者下毒（当晚及次日中毒，信息可能为假）');
  reResolveKill(); render();
}
/* ---------- 僧侣守护 / 士兵免疫（影响恶魔击杀） ---------- */
function healthy(i){ return i>=0 && meta[i] && !meta[i].poison && !meta[i].drunk && !meta[i].isDrunk; }
function deathCauseLabel(i){
  const h=meta[i]&&meta[i].hist; if(!h) return "";
  let txt=""; Object.keys(h).forEach(n=>{ if(h[n]&&h[n].death) txt=h[n].death; });
  if(!txt) return "";
  if(txt.indexOf('处决')>=0) return '处决';
  if(txt.indexOf('猎人')>=0) return '被射杀';
  if(txt.indexOf('小恶魔')>=0 || txt.indexOf('代 ')>=0 || txt.indexOf('自杀')>=0) return '夜晚死亡';
  return '出局';
}
function deathCauseIcon(i){ const dc=deathCauseLabel(i);
  if(dc==='处决') return 'assets/s-execution.png';     // 激进抠图（绞索圈）
  if(dc==='被射杀') return 'assets/mk-slayer.png';
  if(dc==='夜晚死亡') return 'assets/g3-demonkill.png';
  return 'assets/bg-dead.png'; }   // 手动/未知死因 → 淡化骷髅
function isProtected(target){
  const monk=meta.findIndex(m=>m&&m.role==="monk");
  if(monk>=0 && !isDeadSeat(monk) && healthy(monk) && monkPicks[night]===target) return true;   // 僧侣守护
  if(meta[target] && meta[target].role==="soldier" && healthy(target)) return true;              // 士兵免疫
  return false;
}
function reResolveKill(){
  const rec=impKills[night]; if(!rec||rec.type!=="normal") return;
  const t=rec.target, blocked=isProtected(t); if(blocked===rec.blocked) return;
  if(blocked){ if(rec.death>=0){ killSeat(rec.death,false); if(rec.death!==t) histSet(rec.death,'death',null); } rec.death=-1;
    histSet(rec.imp,'kill','击杀 '+nameAt(t)+'（被守护/免疫，未死）'); histSet(t,'death',null); histSet(t,'protected','被小恶魔选中但幸免（守护/免疫）'); }
  else { rec.death=t; killSeat(t,true); histSet(rec.imp,'kill','击杀 '+nameAt(t)); histSet(t,'protected',null); histSet(t,'death','被小恶魔击杀出局'); }
  rec.blocked=blocked;
}
function monkPick(v){ if(v==="") delete monkPicks[night]; else monkPicks[night]=+v; reResolveKill(); render(); }
function monkUI(){
  const mk=meta.findIndex(m=>m&&m.role==="monk"); if(mk<0) return "";
  if(isDeadSeat(mk)) return '<div class="impkill done" style="color:#8a6a2a">僧侣已出局，未行动</div>';
  const rec=monkPicks[night];
  let opts='<option value="">—</option>';
  allSeats().forEach(i=>{ if(i===mk) return; opts+='<option value="'+i+'"'+(rec===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+(isDeadSeat(i)?'（已出局）':'')+'</option>'; });
  return '<div class="impkill">守护目标：<select onchange="monkPick(this.value)">'+opts+'</select></div>';
}
/* ---------- 厨师 / 共情者：数字信息；中毒时可自定数字 ---------- */
function chefPairs(){ let p=0; for(let k=0;k<N;k++){ if(regEvil(k)&&regEvil((k+1)%N)) p++; } return p; }
function empathNum(seat){ const l=nearestLiving(seat,-1), r=nearestLiving(seat,1); let c=0; if(l>=0&&regEvil(l))c++; if(r>=0&&r!==l&&regEvil(r))c++; return c; }
function sickSet(roleId,v){ const k=night+":"+roleId; if(v==="") delete sickAns[k]; else sickAns[k]=v; render(); }
function numRole(roleId,label){ return {
  seat: meta.findIndex(m=>m&&m.role===roleId),
  trueVal: roleId==="chef"?chefPairs():empathNum(meta.findIndex(m=>m&&m.role==="empath")),
  label };
}
function recordNum(roleId,label){ const info=numRole(roleId,label); const s=info.seat; if(s<0) return;
  if(!nightChecks[night+":"+roleId]){ histSet(s,'info',null); return; }   // 未勾选该步骤则不记录
  if(healthy(s)){ histSet(s,'info',label+'：'+info.trueVal+' · 真'); return; }
  const c=sickAns[night+":"+roleId]; if(c==null){ histSet(s,'info',null); return; }
  histSet(s,'info',label+'：'+c+' · '+(+c===info.trueVal?'真':'假')); }
function numUI(roleId,label,maxV){ const info=numRole(roleId,label); const s=info.seat; if(s<0||isDeadSeat(s)||healthy(s)) return "";
  const cur=sickAns[night+":"+roleId]; let o='<option value="">数值</option>';
  for(let n=0;n<=maxV;n++){ o+='<option value="'+n+'"'+(cur==String(n)?' selected':'')+'>'+n+'</option>'; }
  let h='<div class="impkill warn">中毒·自定'+label+'：<select onchange="sickSet(\''+roleId+'\',this.value)">'+o+'</select></div>';
  if(cur!=null) h+='<div class="impkill '+(+cur===info.trueVal?'done':'warn')+'">'+label+'：'+cur+' · '+(+cur===info.trueVal?'真':'假')+'</div>';
  return h; }
/* ---------- 送葬者：得知昨日被处决者角色；中毒时可自定假身份 ---------- */
function undertakerResult(){
  const ut=meta.findIndex(m=>m&&m.role==="undertaker"); if(ut<0) return null;
  const ex=executions[night-1]; if(ex===undefined || ex<0) return null;
  const trueRole = meta[ex] ? (meta[ex].isDrunk ? 'drunk' : meta[ex].role) : null;   // 酒鬼真身=酒鬼
  const trueName = trueRole && RMAP[trueRole] ? RMAP[trueRole].name : null;
  if(healthy(ut)){ if(!trueName) return null; return {text:'昨日处决 '+nameAt(ex)+' ＝ '+trueName+' · 真', truth:true}; }
  const rec=undertakerPicks[night]; if(!rec) return null;
  const truth=(rec===trueRole); return {text:'昨日处决 '+nameAt(ex)+' ＝ '+RMAP[rec].name+' · '+(truth?'真':'假'), truth};
}
function undertakerSet(v){ if(v==="") delete undertakerPicks[night]; else undertakerPicks[night]=v; render(); }
function recordUndertaker(){ const ut=meta.findIndex(m=>m&&m.role==="undertaker"); if(ut<0) return;
  if(!nightChecks[night+":undertaker"]){ histSet(ut,'info',null); return; }   // 未勾选则不记录
  const r=undertakerResult(); histSet(ut,'info', r?r.text:null); }
function undertakerUI(){
  const ut=meta.findIndex(m=>m&&m.role==="undertaker"); if(ut<0||isDeadSeat(ut)) return "";
  const ex=executions[night-1]; if(ex===undefined || ex<0) return "";
  if(healthy(ut)) return "";                          // 健康：信息行已显示，自动记录
  let rOpt='<option value="">告知的角色</option>';
  ROLES.filter(r=>!lockedRoles.has(r.id)).forEach(r=>{ rOpt+='<option value="'+r.id+'"'+(undertakerPicks[night]===r.id?' selected':'')+'>'+r.name+'</option>'; });
  let h='<div class="impkill warn">中毒·告知的假身份：<select onchange="undertakerSet(this.value)">'+rOpt+'</select></div>';
  const r=undertakerResult(); if(r) h+='<div class="impkill '+(r.truth?'done':'warn')+'">'+r.text+'</div>';
  return h;
}
/* ---------- 守鸦人：夜里死亡时选 1 人得知其角色 ---------- */
function ravenResult(){
  const rk=meta.findIndex(m=>m&&m.role==="ravenkeeper"); if(rk<0) return null;
  const rec=ravenPicks[night]||{}; if(rec.t==null) return null;
  const actual = (meta[rec.t]&&meta[rec.t].role)?meta[rec.t].role:null;
  if(healthy(rk)){ if(!actual) return null; return {text:'得知 '+nameAt(rec.t)+' ＝ '+RMAP[actual].name+' · 真', truth:true}; }
  if(!rec.role) return null; const truth=actual===rec.role;
  return {text:'得知 '+nameAt(rec.t)+' ＝ '+RMAP[rec.role].name+' · '+(truth?'真':'假'), truth};
}
function ravenSet(field,v){ if(!ravenPicks[night]) ravenPicks[night]={}; const rec=ravenPicks[night];
  if(field==="t") rec.t = v===""?null:+v; else rec.role = v===""?null:v;
  const rk=meta.findIndex(m=>m&&m.role==="ravenkeeper"); const r=ravenResult(); histSet(rk,'info', r?r.text:null); render(); }
function ravenUI(){
  const rk=meta.findIndex(m=>m&&m.role==="ravenkeeper"); if(rk<0) return "";
  if(!isDeadSeat(rk)) return '<div class="impkill" style="opacity:.65">守鸦人存活 · 仅夜间死亡才行动</div>';
  const rec=ravenPicks[night]||{}, sick=!healthy(rk);
  let opts='<option value="">选查看对象</option>';
  for(let i=0;i<N;i++){ if(i===rk) continue; opts+='<option value="'+i+'"'+(rec.t===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+'</option>'; }
  let h='<div class="impkill warn">守鸦人已死·查看：<select onchange="ravenSet(\'t\',this.value)">'+opts+'</select></div>';
  if(sick){
    let rOpt='<option value="">告知的角色</option>';
    ROLES.filter(r=>!lockedRoles.has(r.id)).forEach(r=>{ rOpt+='<option value="'+r.id+'"'+(rec.role===r.id?' selected':'')+'>'+r.name+'</option>'; });
    h+='<div class="impkill warn">中毒·告知的假身份：<select onchange="ravenSet(\'role\',this.value)">'+rOpt+'</select></div>';
  }
  const r=ravenResult(); if(r) h+='<div class="impkill '+(r.truth?'done':'warn')+'">'+r.text+'</div>';
  return h;
}
/* ---------- 管家：选主人，次日仅当主人投票才可投 ---------- */
function butlerSeat(){ return meta.findIndex(m=>m&&m.role==="butler"); }
function butlerPick(v){ if(v==="") delete butlerPicks[night]; else butlerPicks[night]=+v; enforceButler(); render(); }
function butlerUI(){
  const b=butlerSeat(); if(b<0) return "";
  if(isDeadSeat(b)) return '<div class="impkill done" style="color:#8a6a2a">管家已出局，未行动</div>';
  const rec=butlerPicks[night];
  let opts='<option value="">—</option>';
  allSeats().forEach(i=>{ if(i===b) return; opts+='<option value="'+i+'"'+(rec===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+(isDeadSeat(i)?'（已出局）':'')+'</option>'; });
  return '<div class="impkill">主人：<select onchange="butlerPick(this.value)">'+opts+'</select></div>';
}
function enforceButler(){
  const b=butlerSeat(); if(b<0 || !healthy(b)) return;   // 管家中毒/醉酒时无限制
  const master=butlerPicks[night]; const noms=nominations[night]||[];
  noms.forEach(nom=>{ const bi=nom.voters.indexOf(b);
    if(bi>=0 && (master==null || !nom.voters.includes(master))) nom.voters.splice(bi,1); });   // 主人没投则移除管家票
}
/* ---------- 占卜师选 2 人 + 红鲱鱼 ---------- */
function readsDemon(i){
  if(i==null||i<0) return false; const m=meta[i]; if(!m||!m.role) return false;
  if(RMAP[m.role].team==="dem") return true;
  if(m.role==="recluse" && effReg(i)==="evil") return true;   // 陌客可读为恶魔
  if(i===redHerring) return true;                             // 红鲱鱼
  return false;
}
function ftPick(idx,v){
  let p=(ftPicks[night]||[null,null]).slice(); p[idx]= v===""?null:+v;
  if(p[0]==null && p[1]==null) delete ftPicks[night]; else ftPicks[night]=p;
  render();
}
function ftAuto(){ const cur=ftPicks[night]; if(!cur||cur[0]==null||cur[1]==null) return null; return readsDemon(cur[0])||readsDemon(cur[1]); }
function recordFt(){ const ft=meta.findIndex(m=>m&&m.role==="fortuneteller"); if(ft<0) return;
  const auto=ftAuto(), cur=ftPicks[night];
  if(auto==null){ histSet(ft,'info',null); return; }
  if(healthy(ft)){ histSet(ft,'info','占卜 '+nameAt(cur[0])+'、'+nameAt(cur[1])+' → '+(auto?'有恶魔':'无')+' · 真'); return; }
  const c=sickAns[night+":fortuneteller"]; if(!c){ histSet(ft,'info',null); return; }
  const given=c==='yes', truth=given===auto;
  histSet(ft,'info','占卜 '+nameAt(cur[0])+'、'+nameAt(cur[1])+' → '+(given?'有恶魔':'无')+' · '+(truth?'真':'假')); }
/* 本局速览混淆镇民数：男爵 +2；恶魔伪装每含 1 外来者 +1 */
function refreshOverviewDecoys(){
  let need=0;
  if(meta.some(m=>m&&m.role==="baron")) need+=2;
  need+=bluffs.filter(b=>b&&RMAP[b]&&RMAP[b].team==="out").length;
  const inPlay=new Set(meta.map(m=> m && (m.isDrunk?'drunk':m.role)).filter(Boolean));
  const bluffSet=new Set(bluffs.filter(Boolean));
  const valid=id=>RMAP[id]&&RMAP[id].team==="tf"&&!inPlay.has(id)&&!bluffSet.has(id)&&!lockedRoles.has(id);
  let keep=(overviewDecoys||[]).filter(valid).slice(0,need);
  if(keep.length<need){
    const used=new Set([...inPlay, ...bluffSet, ...keep]);
    const pool=ROLES.filter(r=>r.team==="tf"&&!used.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    keep=keep.concat(pool.slice(0,need-keep.length));
  }
  overviewDecoys=keep;
}
/* 本局速览角色集合：在场镇民 + 恶魔伪装 + 全部外来者/爪牙/恶魔 + 混淆镇民 */
function gameOverviewSet(){
  const s=new Set();
  ROLES.forEach(r=>{ if(r.team!=="tf" && !lockedRoles.has(r.id)) s.add(r.id); });
  meta.forEach(m=>{ if(m.role && RMAP[m.role].team==="tf") s.add(m.role); });
  bluffs.forEach(b=>{ if(b) s.add(b); });
  (overviewDecoys||[]).forEach(id=>s.add(id));
  return s;
}
/* ---------- 洗衣妇 / 图书管理员 / 调查员：选 2 人；健康时系统自动判定，中毒时手选并标真假 ---------- */
function pingTeam(roleId){ return roleId==="washerwoman"?"tf":roleId==="librarian"?"out":"min"; }
function pingResult(roleId){
  const seat=meta.findIndex(m=>m&&m.role===roleId); if(seat<0) return null;
  const team=pingTeam(roleId), rec=pingPicks[roleId]||{}, sick=!healthy(seat);
  const mk=(text,truth)=>({text:text+' · '+(truth?'真':'假'),truth});
  if(!sick){                                        // 健康：第一个是真身，系统用其身份
    if(roleId==="librarian" && teamSeats("out").length===0) return mk('没有外来者',true);
    if(rec.a==null||rec.b==null||rec.b===rec.a) return null;
    const rm=meta[rec.a]; if(!rm||!rm.role||RMAP[rm.role].team!==team) return null;
    return mk(nameAt(rec.a)+'、'+nameAt(rec.b)+' 中有一个是 '+RMAP[rm.role].name, true);
  } else {                                          // 中毒/醉酒：手选，系统对照真伪
    if(rec.role==="__none") return mk('没有外来者', teamSeats("out").length===0);
    if(rec.a==null||rec.b==null||!rec.role) return null;
    const real=(meta[rec.a]&&meta[rec.a].role===rec.role)||(meta[rec.b]&&meta[rec.b].role===rec.role);
    return mk(nameAt(rec.a)+'、'+nameAt(rec.b)+' 中有一个是 '+RMAP[rec.role].name, real);
  }
}
function pingSet(roleId,field,v){ if(!pingPicks[roleId]) pingPicks[roleId]={}; const rec=pingPicks[roleId];
  if(field==="role") rec.role = v===""?null:v; else rec[field] = v===""?null:+v;
  const seat=meta.findIndex(m=>m&&m.role===roleId); const r=pingResult(roleId); histSet(seat,'info', r?r.text:null); render(); }

  } else {                                          // 健康：第一个只列该阵营，第二个列其余任意人
    let o1='<option value="">'+teamName+'</option>';
    teamSeats(team).forEach(i=>{ o1+='<option value="'+i+'"'+(rec.a===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+'</option>'; });
    let o2='<option value="">另一人</option>';
    for(let i=0;i<N;i++){ if(i===rec.a) continue; o2+='<option value="'+i+'"'+(rec.b===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+'</option>'; }
    h+='<div class="impkill">'+teamName+'：<select onchange="pingSet(\''+roleId+'\',\'a\',this.value)">'+o1+'</select>'
      +'另一人：<select onchange="pingSet(\''+roleId+'\',\'b\',this.value)">'+o2+'</select></div>';
  }
  const r=pingResult(roleId);
  if(r) h+='<div class="impkill '+(r.truth?'done':'warn')+'">答案：'+r.text+'</div>';

}

/* ---------- 红唇女郎：任何方式的恶魔死亡都可能触发接任 ---------- */
function demonDied(demonSeat){
  const m=meta[demonSeat]; if(!m||!RMAP[m.role]||RMAP[m.role].team!=="dem") return;

    if(nom.virginExec!=null){ killSeat(nom.virginExec,false); histSet(nom.virginExec,'death',null); if(executions[day]===nom.virginExec) delete executions[day]; } }
  nominations[day].splice(idx,1); if(!nominations[day].length) delete nominations[day]; }
  if(window._syncNoms) window._syncNoms(); render(); }
function toggleVote(day,nomIdx,seat){ const nom=nominations[day][nomIdx]; const at=nom.voters.indexOf(seat);
  if(at>=0){ nom.voters.splice(at,1); if(nom.ghostVoters){ const gi=nom.ghostVoters.indexOf(seat); if(gi>=0) nom.ghostVoters.splice(gi,1); } }
  else { nom.voters.push(seat); if(isDeadSeat(seat)){ nom.ghostVoters=nom.ghostVoters||[]; if(!nom.ghostVoters.includes(seat)) nom.ghostVoters.push(seat); } }   // 已出局也可自由投票；死亡=鬼票
  enforceButler(); if(window._syncNoms) window._syncNoms(); render(); }
/* ---------- 猎人：每局一次，白天指认，命中恶魔则其死 ---------- */
function registersDemon(i){ const m=meta[i]; if(!m||!m.role) return false; if(RMAP[m.role].team==="dem") return true; if(m.role==="recluse"&&effReg(i)==="evil") return true; return false; }
function slayerFire(v){ if(v===""||slayerShot) return; const t=+v; const sl=meta.findIndex(m=>m&&m.role==="slayer"); if(sl<0) return;
  const hit = healthy(sl) && !isDeadSeat(sl) && registersDemon(t);
  slayerShot={target:t, day:night, hit};
  if(hit){ killSeat(t,true); histSet(t,'death','被猎人射杀出局'); demonDied(t); }
  if(window._syncNoms) window._syncNoms(); if(window._syncSeats) window._syncSeats();
  if(hit && window._pubSlayer) window._pubSlayer();   // 猎人成功射杀恶魔→播放动画（红唇继任也播）
  render(); }
function slayerUndo(){ if(!slayerShot) return; const t=slayerShot.target;
  if(slayerShot.hit){ demonRevived(t); killSeat(t,false); histSet(t,'death',null); }
  slayerShot=null; if(window._syncNoms) window._syncNoms(); if(window._syncSeats) window._syncSeats(); render(); }
function slayerUI(){
  const sl=meta.findIndex(m=>m&&m.role==="slayer"); if(sl<0) return "";
  let h='<div class="gsec">猎人（每局一次·白天）</div>';
  if(slayerShot){ const t=slayerShot.target; let res;
    if(slayerShot.hit){ const sw=meta[t]&&meta[t]._swSeat; res=(sw!=null)?'命中！红唇女郎 '+nameAt(sw)+' 接任':'<b class="onblock">命中！恶魔死亡 → 好人胜利</b>'; }
    else res='未命中（非恶魔或猎人失效）';
    return h+'<div class="rrow" style="border:none">第 '+slayerShot.day+' 天 · '+nameAt(sl)+' 射向 '+nameAt(t)+' → '+res+' <span class="regbtn" onclick="slayerUndo()">撤销</span></div>';
  }
  if(isDeadSeat(sl)) return h+'<div class="rrow" style="border:none;opacity:.6">猎人已出局，无法开枪</div>';
  let opts='<option value="">目标</option>'; livingSeats().forEach(i=>{ opts+='<option value="'+i+'">'+(i+1)+' '+nameAt(i)+'</option>'; });
  return h+'<div class="rrow" style="border:none">开枪：<select onchange="slayerFire(this.value)">'+opts+'</select></div>';

function doExecute(seat){ const day=night; const prev=executions[day];
  if(prev!=null && prev>=0){ demonRevived(prev); killSeat(prev,false); histSet(prev,'death',null); }   // 撤销上次处决
  if(seat<0){ executions[day]=-1; if(window._syncNoms) window._syncNoms(); if(window._syncSeats) window._syncSeats(); render(); return; }
  executions[day]=seat; killSeat(seat,true); histSet(seat,'death','第'+day+'天被处决出局');
  const _isDem=!!(meta[seat]&&meta[seat].role&&RMAP[meta[seat].role]&&RMAP[meta[seat].role].team==='dem');
  const _ei=Math.floor(Math.random()*EXEC_VIDEOS.length);
  demonDied(seat);   // 可能触发红唇女郎接任（产生新恶魔）
  const _demonAlive=meta.some((m,i)=>m&&m.role&&RMAP[m.role]&&RMAP[m.role].team==='dem' && !isDeadSeat(i));
  const _full=_isDem && !_demonAlive;   // 仅当处决的是场上最后一个恶魔、且无新恶魔接任（同好人胜利条件）时才播完整变身视频；红唇女郎接任则只播前半段
  if(window._syncNoms) window._syncNoms(); if(window._syncSeats) window._syncSeats();
  if(window._pubExec) window._pubExec(_ei, _full); render(); }
function poisonUI(){
  const pz=poisonerSeat(); if(pz<0) return "";
  if(isDeadSeat(pz)) return '<div class="impkill done" style="color:#8a6a2a">投毒者已出局，未行动</div>';
  const rec=poisonPicks[night];
  let opts='<option value="">—</option>';
  allSeats().forEach(i=>{ opts+='<option value="'+i+'"'+(rec===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+(i===pz?'（自己）':isDeadSeat(i)?'（已出局）':'')+'</option>'; });
  return '<div class="impkill">下毒目标：<select onchange="poisonPick(this.value)">'+opts+'</select></div>';
}
function revertImpKill(prev){
  if(!prev) return;
  if(prev.type==="normal"){
    if(prev.death!=null && prev.death>=0) killSeat(prev.death,false);
    histSet(prev.imp,'kill',null); histSet(prev.target,'death',null); histSet(prev.target,'protected',null);
    if(prev.death!=null && prev.death>=0 && prev.death!==prev.target) histSet(prev.death,'death',null);
    return;
  }
  if(prev.type==="starpass"){
    killSeat(prev.target,false);                                     // 复活自杀的恶魔
    histSet(prev.target,'kill',null); histSet(prev.target,'death',null);
    if(prev.newImp!=null){ meta[prev.newImp].role=(prev.newImpPrevRole!==undefined?prev.newImpPrevRole:null); histSet(prev.newImp,'role',null); }
  }
}
function impKill(v){
  revertImpKill(impKills[night]);                                    // 先撤销本夜上一次击杀/转移
  const imp=impSeat(); if(imp<0){ delete impKills[night]; render(); return; }
  if(v===""){ delete impKills[night]; render(); return; }
  const target=+v;
  if(target===imp){
    const sw=meta.findIndex(m=>m&&m.role==="scarletwoman");
    const swAlive=sw>=0 && !isDeadSeat(sw) && healthy(sw);          // 红唇中毒/醉酒则不接任
    const aliveNow=countAlive();                                     // 恶魔尚存活，含恶魔计数
    killSeat(imp,true);
    histSet(imp,'kill','自杀'); histSet(imp,'death','自杀出局');
    if(swAlive && aliveNow>=5){
      const pr=meta[sw].role; meta[sw].role="imp";
      histSet(sw,'role','红唇女郎触发 → 成为小恶魔');
      impKills[night]={type:"starpass",target:imp,newImp:sw,auto:true,newImpPrevRole:pr};
    } else impKills[night]={type:"starpass",target:imp,newImp:null,auto:false};
  } else {
    const blocked=isProtected(target);
    const isMayor = !!(meta[target] && meta[target].role==="mayor" && healthy(target));   // 镇长可弹刀
    const death = blocked ? -1 : target;
    if(death>=0){ killSeat(death,true); histSet(death,'death','被小恶魔击杀出局'); }
    histSet(imp,'kill','击杀 '+nameAt(target)+(blocked?'（被守护/免疫，未死）':''));
    if(blocked) histSet(target,'protected','被小恶魔选中但幸免（守护/免疫）');
    impKills[night]={type:"normal",target:target,imp:imp,blocked:blocked,mayor:isMayor,death:death};
  }
  render();
}
function mayorRedirect(v){ const rec=impKills[night]; if(!rec||rec.type!=="normal"||!rec.mayor) return;
  if(rec.death>=0){ killSeat(rec.death,false); histSet(rec.death,'death',null); }
  const nd = v===""?-1:+v; rec.death=nd;
  if(nd>=0){ killSeat(nd,true); histSet(nd,'death', nd===rec.target?'被小恶魔击杀出局':'镇长弹刀 → 代 '+nameAt(rec.target)+' 死亡'); }
  render(); }
function chooseNewImp(v){
  if(v==="") return; const ni=+v; const rec=impKills[night];
  if(!rec||rec.type!=="starpass") return;
  if(rec.newImp!=null && rec.newImpPrevRole!==undefined){ meta[rec.newImp].role=rec.newImpPrevRole; histSet(rec.newImp,'role',null); } // 还原上一个接任者
  rec.newImpPrevRole=meta[ni].role; meta[ni].role="imp";
  histSet(ni,'role','接任成为新小恶魔');
  rec.newImp=ni; render();
}
function impKillUI(){
  const rec=impKills[night]||{};
  const imp=impSeat(); if(imp<0 && rec.type!=="starpass") return "";
  if(imp>=0 && isDeadSeat(imp) && rec.type!=="starpass") return '<div class="impkill done" style="color:#8a6a2a">小恶魔已出局，未行动</div>';
  const selfSeat=(rec.type==="starpass")?rec.target:imp;             // 用于「自己·自杀」标注
  const cand=new Set(livingSeats());
  if(rec.target!=null) cand.add(rec.target);                          // 已被击杀的目标也要留在选项里
  if(selfSeat>=0) cand.add(selfSeat);
  const list=[...cand].sort((a,b)=>a-b);
  let opts='<option value="">—</option>';
  list.forEach(i=>{ const self=i===selfSeat?'（自己·自杀）':''; const out=(isDeadSeat(i)&&rec.target===i)?'（已出局）':'';
    opts+='<option value="'+i+'"'+(rec.target===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+self+out+'</option>'; });
  let h='<div class="impkill">击杀目标：<select onchange="impKill(this.value)">'+opts+'</select></div>';
  if(rec.type==="starpass"){
    if(rec.newImp!=null){ h+='<div class="impkill done">'+(rec.auto?'红唇女郎':'新小恶魔')+' '+nameAt(rec.newImp)+' 已成为小恶魔 ✓</div>'; }
    else{
      const mins=teamSeats("min").filter(i=>!isDeadSeat(i));
      if(mins.length){ let mo='<option value="">选择存活爪牙</option>';
        mins.forEach(i=>{ mo+='<option value="'+i+'">'+(i+1)+' '+nameAt(i)+'</option>'; });
        h+='<div class="impkill warn">⚠ 未触发红唇女郎，请选新小恶魔：<select onchange="chooseNewImp(this.value)">'+mo+'</select></div>'; }
      else h+='<div class="impkill warn">⚠ 无存活爪牙可接任 → 恶魔真死</div>';
    }
  }
  if(rec.type==="normal" && rec.mayor){                                // 镇长弹刀：实际死亡可改
    let mo='<option value=""'+(rec.death<0?' selected':'')+'>无人死亡</option>';
    for(let i=0;i<N;i++){ if(i===rec.target || i===rec.death || !isDeadSeat(i)){ mo+='<option value="'+i+'"'+(rec.death===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+(i===rec.target?'（镇长本人）':'')+'</option>'; } }
    h+='<div class="impkill warn">镇长弹刀·实际死亡：<select onchange="mayorRedirect(this.value)">'+mo+'</select></div>';
  }
  return h;
}

/* ---------- view ---------- */
function setView(){ view=(view==="seat"?"grim":"seat"); if(view==="grim") ensureMeta(); render(); }
function setGtab(t){ gtab=t; render(); }
function setListMode(m){ listMode=m; render(); }
function toggleLock(id){ if(lockedRoles.has(id)) lockedRoles.delete(id); else lockedRoles.add(id); render(); }
/* ---------- 自定义阵营数量 ---------- */
function setDistCount(idx,delta){ const cd=(customDist||DIST[N]).slice();
  const mx=[13,4,4,1][idx], mn=idx===3?1:0;
  cd[idx]=Math.max(mn, Math.min(mx, cd[idx]+delta)); customDist=cd; save(); render(); }
function resetDist(){ customDist=null; save(); render(); }
function onStepCheck(sid,on){ nightChecks[night+":"+sid]=on; if(sid[0]==="_") recordSpecial(sid,on); else recordStep(sid,on); render(); }

function applyView(){
  const stage=document.getElementById("stage");
  stage.classList.toggle("grim", view==="grim");
  document.getElementById("bannerTitle").textContent = view==="grim" ? "说书人魔典" : "暗流涌动";
  const vt=document.getElementById("viewToggle");
  vt.innerHTML = '<img src="assets/'+(view==="grim"?"book-open.png":"book-closed.png")+'" alt="">';
  vt.title = view==="grim" ? "返回座位图（合上魔典）" : "打开说书人魔典";

function renderLedger(){
  const pool=document.getElementById("pool"); pool.innerHTML="";
  if(tokens.length===0){ pool.innerHTML='<span class="empty-hint">（无 · 添加新客人或从往期名单邀请）</span>'; }
  tokens.forEach(t=>pool.appendChild(chipEl(t)));
  const past=document.getElementById("past"); past.innerHTML="";
  if(guests.length===0){ past.innerHTML='<span class="empty-hint">（还没有客人）</span>'; }
  guests.forEach(name=>{
    const active=tokens.some(t=>t.name===name);
    const reg=!!(window._isRegistered&&window._isRegistered(name));
    const el=document.createElement("span"); el.className="ptag"+(active?" active":"")+(reg?" reg":"");
    el.innerHTML=(reg?'<span class="regdot" title="已注册账号">●</span> ':'')+esc(name)+' <span class="del" title="'+(reg?'删除账号（停用+清空笔记）':'从名单删除')+'">✕</span>';

function chipEl(t){

      seatsN.sort((A,B)=> (keyFor(A.i,A.e)-keyFor(B.i,B.e)) || (A.i-B.i));

  if(gtab==="day"){

    noms.forEach((nom,idx)=>{ const v=nom.voters.length; const isB=(nom.nominee===block && block>=0);

      h+='</div>';
      if(!nom.tallied){ h+='<div class="votectl">'+(active?'<span class="hcnt">✋ '+handCnt+' 人举手中</span>':'')

      else { h+='<div class="votectl"><span class="revok">✓ 已计票 · '+v+' 票</span><span class="regbtn" onclick="_voteReopen('+day+','+idx+')">重新计票</span></div>'; }
      h+='</div>'; });
    const neSet=new Set(noms.map(x=>x.nominee)), nrSet=new Set(noms.map(x=>x.nominator));
    let nrOpt='<option value="">提名人</option>', neOpt='<option value="">被提名</option>';
    allSeats().forEach(i=>{ if(!nrSet.has(i)) nrOpt+='<option value="'+i+'">'+(i+1)+' '+nameAt(i)+(isDeadSeat(i)?'（已出局）':'')+'</option>'; });

    h+='<div class="impkill"><select id="nomNr">'+nrOpt+'</select><select id="nomNe">'+neOpt+'</select>'

    h+='<div class="gsec">处决</div>';
    if(block>=0) h+='<div class="rrow" style="border:none">上台：<b class="onblock">'+nameAt(block)+'</b> <span class="regbtn" onclick="doExecute('+block+')">处决</span></div>';
    else h+='<div class="rrow" style="border:none;opacity:.7">暂无人达处决票数（或平票）</div>';
    h+='<div class="rrow" style="border:none"><span class="regbtn" onclick="doExecute(-1)">今日无人处决</span></div>';
    const ex=executions[day];
    if(ex!==undefined){
      if(ex===-1) h+='<div class="rrow" style="color:#2e7d43">今日无人处决 ✓</div>';
      else { const r=meta[ex]&&meta[ex].role?RMAP[meta[ex].role]:null;
        h+='<div class="rrow" style="color:#b0402e">已处决：'+nameAt(ex)+'（'+(r?r.name+(meta[ex].isDrunk?'-酒鬼':''):'未分配')+'）✓</div>';
        if(meta[ex]&&meta[ex].role==="saint") h+='<div class="rrow onblock">⚠ 圣徒被处决 → 好人落败</div>';
        if(r&&r.team==="dem"){ const m2=meta[ex];
          if(m2&&m2._swSeat!=null) h+='<div class="rrow onblock">恶魔被处决 → 红唇女郎 '+nameAt(m2._swSeat)+' 接任成为新恶魔</div>';
          else h+='<div class="rrow" style="color:#2e7d43;font-weight:800">恶魔被处决 → 好人胜利！</div>'; }
      }
    }

    if(my>=0 && !isDeadSeat(my) && healthy(my) && alive===3){
      if(executions[day]===-1) h+='<div class="rrow" style="color:#2e7d43;font-weight:800">镇长：仅剩 3 人且今日无处决 → 好人胜利！</div>';
      else h+='<div class="rrow" style="color:#8a5f28">镇长提示：仅剩 3 人，若今日无人处决则好人胜利</div>';
    }
    c.innerHTML=h; return;
  }
  {
    const inplay=new Set(meta.map(m=>m.role).filter(Boolean));
    const hasTeam=t=>meta.some(m=>m.role&&RMAP[m.role].team===t);

      else{ const r=RMAP[s.id]; const ds=meta.some(m=>m&&m.role===s.id&&m.isDrunk);

      const ck=nightChecks[night+":"+s.id]?" checked":"";
      h+='<label class="nstep"><input type="checkbox"'+ck+' onchange="onStepCheck(\''+s.id+'\',this.checked)"><span><b style="color:'+color+'">'+name+'</b> <span class="nn">'+s.note+'</span>'+(info?'<div class="ninfo">'+info+'</div>':'')+'</span></label>';

      if(s.id==="monk") h+=monkUI();
      if(s.id==="butler") h+=butlerUI();

      if(s.id==="undertaker") h+=undertakerUI();

      if(s.id==="empath") h+=numUI("empath","两侧存活邻座邪恶数",2);
      if(s.id==="washerwoman"||s.id==="librarian"||s.id==="investigator") h+=pingUI(s.id);
      if(night>=2 && s.id==="imp") h+=impKillUI(); });
    const _dawnReady = steps.length>0 && steps.every(s=> nightChecks[night+":"+s.id]);
    h+='<div style="margin-top:14px">'
      +'<button class="btn purple" style="width:100%;font-weight:800;'+(_dawnReady?'':'opacity:.4;cursor:not-allowed;filter:grayscale(.85);')+'" '+(_dawnReady?'onclick="stDawn()"':'disabled')+'>结束本夜</button>'
      +(_dawnReady?'':'<div style="text-align:center;font-size:11px;color:#8a7250;margin-top:5px">完成本夜所有流程后可点亮</div>')
      +'</div>';
  }
  c.innerHTML=h;
}
function renderSeats(){
  if(window.BOTC_VIEWER) return;
  const zone=document.getElementById("tableZone");
  [...zone.querySelectorAll(".seat")].forEach(e=>e.remove());
  seatPos=[];
  const stage=document.getElementById("stage");
  const SW=stage.clientWidth, SH=stage.clientHeight;
  const zoneLeft=0.40*SW, zoneTop=0.08*SH;
  const cx=SW*0.71-zoneLeft, cy=SH*0.525-zoneTop, R=SH*0.34;
  tableCenter={x:SW*0.71, y:SH*0.525};
  const seatD=Math.max(R*0.26, Math.min(R*0.78, R*3.8/N));
  const numD=seatD*0.46, numF=numD*0.6, nmF=Math.max(11,seatD*0.24), rF=Math.max(9,seatD*0.17);
  for(let i=0;i<N;i++){
    const ang=-Math.PI/2+i*2*Math.PI/N;
    const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
    const s=document.createElement("div"); s.className="seat";
    s.style.left=x+"px"; s.style.top=y+"px"; s.style.width=seatD+"px"; s.style.height=seatD+"px"; s.dataset.seat=i;
    seatPos[i]={x:zoneLeft+x, y:zoneTop+y, d:seatD};
    const t=seatToken(i);
    let html='<div class="num" style="width:'+numD+'px;height:'+numD+'px;font-size:'+numF+'px">'+(i+1)+'</div>';
    if(view==="seat"){
      if(t){ html+='<div class="nm" style="font-size:'+nmF+'px">'+esc(t.name)+'</div>';
        s.classList.add("filled"); if(t.dead){ s.classList.add("dead","hascause"); const isClaw=deathCauseLabel(i)==='夜晚死亡';
          const pos=isClaw?'calc(50% + 6px) center':'center', sz=isClaw?'80%':'62%';
          s.style.background="url('"+deathCauseIcon(i)+"') "+pos+" / "+sz+" no-repeat, radial-gradient(circle at 50% 35%, rgba(48,34,58,.9), rgba(22,15,30,.95))"; } }
      s.innerHTML=html;
      s.addEventListener("click",()=>seatClick(i));
      s.addEventListener("dragover",e=>{e.preventDefault();s.classList.add("over");});
      s.addEventListener("dragleave",()=>s.classList.remove("over"));
      s.addEventListener("drop",e=>{e.preventDefault();s.classList.remove("over");dropOn(i,e);});
    } else {
      const m=meta[i]||blankMeta(); const role=m.role?RMAP[m.role]:null;
      if(role) s.classList.add(isEvil(role.team)?"evil":"good");
      const dead = t ? !!t.dead : !!m.dead;
      if(dead) s.classList.add("dead");
      html+='<div class="nm" style="font-size:'+nmF+'px">'+(t?esc(t.name):'<span style="opacity:.5">空</span>')+'</div>';
      if(role){ const label=role.name+(m.isDrunk?'-酒鬼':'');
        const rfz=Math.min(rF, Math.floor(0.8*seatD/label.length));
        html+='<div class="role" style="font-size:'+rfz+'px;color:'+(m.isDrunk?TEAMC.out:TEAMC[role.team])+'">'+label+'</div>'; }
      if(dead){ s.classList.add("hascause"); const isClaw=deathCauseLabel(i)==='夜晚死亡';
        const pos=isClaw?'calc(50% + 6px) center':'center', sz=isClaw?'80%':'62%';
        s.style.background="url('"+deathCauseIcon(i)+"') "+pos+" / "+sz+" no-repeat, radial-gradient(circle at 50% 35%, rgba(48,34,58,.9), rgba(22,15,30,.95))"; }
      else if(isProtected(i)){ const rk=impKills[night]; const hit = rk && rk.type==="normal" && rk.target===i && rk.blocked;
        s.style.background=(hit?"url('assets/kp-demonkill.png') calc(50% + 6px) center / 60% no-repeat, ":"")+"url('assets/bg-shield.png') calc(50% + 6px) center / 78% no-repeat, radial-gradient(circle at 50% 35%, rgba(90,60,110,.9), rgba(45,28,60,.95))"; }
      const r=seatD/2, bD=Math.max(18, seatD*0.24)*1.1, dist=r*1.3;
      const badge=(deg,ic,t,scl,glow)=>{ const bd=bD*(scl||1); const a=deg*Math.PI/180, bx=r+dist*Math.sin(a), by=r-dist*Math.cos(a);
        const gf=glow?'filter:drop-shadow(0 0 2px '+glow+') drop-shadow(0 0 4px '+glow+');':'';
        return '<div class="shieldbadge" title="'+t+'" style="width:'+bd+'px;height:'+bd+'px;left:'+(bx-bd/2)+'px;top:'+(by-bd/2)+'px;'+gf+'"><img src="'+ic+'"></div>'; };
      const RA=[30,60,90,120,150];   // 右侧固定 5 等距槽位：骷髅/毒/酒/盾/弩
      [[dead,'assets/mk-dead.png','出局',1,'#000'],[m.poison,'assets/mk-poison.png','中毒',1,'#3fd44f'],[m.drunk,'assets/s-drunk.png','醉酒',1,'#ffe14d'],[isProtected(i)||m.mShield,'assets/mk-shield.png','守护/免疫',1,'#d8dae2'],[(m.role==="slayer"&&slayerShot)||m.mShot,'assets/mk-crossbow.png','猎人已开枪',1.2,'#4aa8ff']]
        .forEach((b,k)=>{ if(b[0]) html+=badge(RA[k],b[1],b[2],b[3],b[4]); });
      if(butlerPicks[night]===i) html+=badge(0,'assets/mk-master.png','管家的主人',1.1,'#f5c542');     // 正上方：王冠·金
      if(redHerring===i) html+=badge(180,'assets/mk-herring.png','红鲱鱼',1.2,'#ff4a3a');             // 正下方：红鲱鱼·红
      s.innerHTML=html;
      s.addEventListener("click",e=>{
        if(s._ct){ clearTimeout(s._ct); s._ct=null; openEditor(i); }
        else { s._ct=setTimeout(()=>{ s._ct=null; toggleBubble(i); }, 230); } });
      s.addEventListener("mouseenter",()=>showHover(i));
      s.addEventListener("mouseleave",hideHover);
      s.addEventListener("dragover",e=>{e.preventDefault();s.classList.add("over");});
      s.addEventListener("dragleave",()=>s.classList.remove("over"));
      s.addEventListener("drop",e=>{e.preventDefault();s.classList.remove("over");
        const d=e.dataTransfer.getData("text");
        if(d&&d.indexOf("role:")===0){ ensureMeta(); const rid=d.slice(5);
          if(rid==="drunk"){ const used=new Set(meta.map(m=>m.role).filter(Boolean));
            const pool=ROLES.filter(r=>r.team==="tf"&&!used.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
            meta[i].role=pool.length?pool[Math.floor(Math.random()*pool.length)]:null; meta[i].isDrunk=true; meta[i].drunk=true; }
          else { meta[i].role=rid; meta[i].isDrunk=false; meta[i].drunk=false; }
          render(); }});
    }
    zone.appendChild(s);
  }
}
function showHover(i){
  if(view!=="grim") return;
  const box=document.getElementById("hoverBox"); const p=seatPos[i], m=meta[i];
  if(!p||!m||!m.role){ hideHover(); return; }
  const r=RMAP[m.role];
  let html='<div class="hb-role">'+(i+1)+' · '+(seatToken(i)?esc(seatToken(i).name):'')+' '+r.name+'</div>';
  html+='<div class="hb-ab"><span style="color:'+TEAMC[r.team]+'">【'+TEAMLABEL[r.team]+'】</span> '+r.ab+'</div>';
  const hist=m.hist||{}; const ns=Object.keys(hist).map(Number).sort((a,b)=>a-b);
  const TAGO=['evil','info','poison','poisoned','kill','protected','death','role']; const lines=[];
  ns.forEach(n=>{ let e=hist[n]; if(typeof e==="string") e={info:e};
    const parts=[]; TAGO.forEach(t=>{ if(e[t]) parts.push(e[t]); });
    if(parts.length) lines.push('<div class="hb-line"><span class="hb-n">第'+n+'夜</span>'+parts.join('；')+'</div>'); });
  if(lines.length) html+='<div class="hb-sep"></div>'+lines.join('');
  box.innerHTML=html;
  const c=tableCenter||{x:p.x,y:p.y};
  const SW=document.getElementById("stage").clientWidth;
  box.style.left=c.x+"px"; box.style.width=Math.round(Math.min(SW*0.22,260))+"px";
  if(checkWin()){ box.style.top=(c.y + SW*0.13 + 14)+"px"; box.style.transform="translate(-50%,0)"; }   // 胜利时移到图标下方
  else { box.style.top=c.y+"px"; box.style.transform="translate(-50%,-50%)"; }
  box.classList.add("on");
}
function hideHover(){ document.getElementById("hoverBox").classList.remove("on"); }
function toggleBubble(i){ if(openBubbles.has(i)) openBubbles.delete(i); else openBubbles.add(i); renderBubbles(); }
function renderBubbles(){
  const layer=document.getElementById("bubbleLayer"); layer.innerHTML="";
  if(view!=="grim") return;
  const stage=document.getElementById("stage"); const SW=stage.clientWidth;
  const BW=Math.round(Math.min(SW*0.24, 230));
  const c=tableCenter||{x:SW/2,y:stage.clientHeight/2};
  openBubbles.forEach(i=>{
    if(i>=N) return; const p=seatPos[i]; if(!p) return;
    const b=document.createElement("div"); b.style.width=BW+"px";
    const dx=p.x-c.x, dy=p.y-c.y, g=14; let cls;
    if(Math.abs(dx)>=Math.abs(dy)){
      if(dx<0){ cls="br"; b.style.left=(p.x+p.d/2+g)+"px"; b.style.top=p.y+"px"; b.style.transform="translateY(-50%)"; }
      else    { cls="bl"; b.style.left=(p.x-p.d/2-g)+"px"; b.style.top=p.y+"px"; b.style.transform="translate(-100%,-50%)"; }
    } else {
      if(dy<0){ cls="bb"; b.style.top=(p.y+p.d/2+g)+"px"; b.style.left=p.x+"px"; b.style.transform="translateX(-50%)"; }
      else    { cls="bt"; b.style.top=(p.y-p.d/2-g)+"px"; b.style.left=p.x+"px"; b.style.transform="translate(-50%,-100%)"; }
    }
    b.className="bubble "+cls;
    const t=seatToken(i); const nm=t?esc(t.name):('座位'+(i+1));
    b.innerHTML='<textarea placeholder="在此记录你自己的备注…"></textarea>';
    const ta=b.querySelector("textarea"); ta.value=meta[i]?(meta[i].info||""):"";
    ta.addEventListener("input",()=>{ ensureMeta(); meta[i].info=ta.value; save(); });
    ["click","mousedown","dblclick"].forEach(ev=>ta.addEventListener(ev,e=>e.stopPropagation()));
    layer.appendChild(b);
  });
}
function hl(i,on){ const seats=document.querySelectorAll(".seat"); const L=(i-1+N)%N,Rn=(i+1)%N;
  seats.forEach(s=>{ const j=+s.dataset.seat; if(on&&(j===L||j===Rn)) s.classList.add("nb"); else s.classList.remove("nb"); }); }

/* ---------- editor ---------- */
function openEditor(i){
  sel=i; ensureMeta(); const t=seatToken(i), m=meta[i];
  document.getElementById("mTitle").textContent="座位 "+(i+1);
  document.getElementById("mName").value=t?t.name:"";
  const selEl=document.getElementById("mRole");
  if(!selEl.dataset.built){ buildRoleSelect(selEl); selEl.dataset.built="1"; }
  selEl.value=m.role||"";
  document.getElementById("mDead").checked=!!(t&&t.dead);
  document.getElementById("mPoison").checked=!!m.poison;
  document.getElementById("mDrunk").checked=!!m.drunk;
  document.getElementById("mShield").checked=!!m.mShield;
  document.getElementById("mShot").checked=!!m.mShot;
  document.getElementById("mMaster").checked=(butlerPicks[night]===i);
  document.getElementById("mHerring").checked=(redHerring===i);
  document.getElementById("mNote").value=m.note||"";
  updAlign();
  document.getElementById("mask").classList.add("on");
}
function buildRoleSelect(sel){
  sel.innerHTML='<option value="">（未分配）</option>';
  ORDER.forEach(t=>{ const g=document.createElement("optgroup"); g.label=TEAMLABEL[t];
    ROLES.filter(r=>r.team===t).forEach(r=>{ const o=document.createElement("option"); o.value=r.id; o.textContent=r.name; g.appendChild(o); });
    sel.appendChild(g); });
}
function updAlign(){ const id=document.getElementById("mRole").value; const box=document.getElementById("mAlign");
  if(!id){ box.innerHTML=""; return; } const t=RMAP[id].team;
  box.innerHTML='<span class="align-badge '+(isEvil(t)?"evil":"good")+'">'+(isEvil(t)?"邪恶":"善良")+" · "+TEAMLABEL[t]+"</span>"; }
function applyEditor(){
  if(sel<0) return; const i=sel; const m=meta[i]; const name=document.getElementById("mName").value.trim();
  let t=seatToken(i);
  if(name){ if(t){ t.name=name; } else { t={id:++uid,name,seat:i,dead:false}; tokens.push(t); } if(!guests.includes(name)) guests.push(name); }
  m.role=document.getElementById("mRole").value||null;
  if(t) t.dead=document.getElementById("mDead").checked;
  m.poison=document.getElementById("mPoison").checked;
  m.drunk=document.getElementById("mDrunk").checked;
  m.mShield=document.getElementById("mShield").checked;
  m.mShot=document.getElementById("mShot").checked;
  if(document.getElementById("mMaster").checked) butlerPicks[night]=i;
  else if(butlerPicks[night]===i) delete butlerPicks[night];
  if(document.getElementById("mHerring").checked) redHerring=i;
  else if(redHerring===i) redHerring=-1;
  m.note=document.getElementById("mNote").value;
}
function closeEditor(){ applyEditor(); document.getElementById("mask").classList.remove("on"); sel=-1; render(); }
function clearSeatMeta(){ if(sel<0)return; meta[sel]=blankMeta(); const t=seatToken(sel); if(t)t.dead=false;
  document.getElementById("mask").classList.remove("on"); sel=-1; render(); }
document.getElementById("mRole").addEventListener("change",updAlign);
document.getElementById("mask").addEventListener("click",e=>{ if(e.target.id==="mask") closeEditor(); });

/* pool as drop target */
const poolEl=document.getElementById("pool");
poolEl.addEventListener("dragover",e=>{e.preventDefault();poolEl.classList.add("over");});
poolEl.addEventListener("dragleave",()=>poolEl.classList.remove("over"));
poolEl.addEventListener("drop",e=>{e.preventDefault();poolEl.classList.remove("over");
  const id=+e.dataTransfer.getData("text"); moveToken(id,null); selected=null; render();});

let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,80);});
load(); render();
</script>

<!-- ================= 多人版逻辑 ================= -->
<script>
(function(){
  const auth=firebase.auth(), db=firebase.database();
  /* 记住我：勾选→LOCAL 持久化（跨会话自动登录，免密码）；否则→SESSION（关标签即登出） */
  function _remembered(){ try{ return localStorage.getItem('botc_remember')==='1'; }catch(e){ return false; } }
  function _setPersist(remember){ try{ localStorage.setItem('botc_remember', remember?'1':''); }catch(e){}
    return auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{}); }   // 始终按标签页隔离：各页面各自登录，互不影响
  const AUTH_READY = auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
  /* Firebase 要求密码≥6位：不足则补齐到6位，≥6位原样（老账号不受影响），从而允许任意长度/留空 */
  function fbPw(pw){ pw=pw||''; return pw.length>=6 ? pw : (pw+'______').slice(0,6); }
  let me=null, role='anon', mode='hall', curGid=null, pub=null, S=null, sel=null, nbTab='mark';
  let notesRef=null, pubBound=null;

  const BADGE={ dead:{g:'💀',t:'出局'}, poison:{g:'🧪',t:'中毒'}, drunk:{g:'🍺',t:'醉酒'}, shield:{g:'🛡️',t:'守护'}, crossbow:{g:'🏹',t:'已开枪'}, master:{g:'👑',t:'主人'}, herring:{g:'🐟',t:'红鲱鱼'} };
  const STAT_ORDER=['poison','drunk','shield','crossbow','herring','master'];
  const CAUSE={ exec:{t:'处决',g:'⚖️',img:'assets/s-execution.png'}, claw:{t:'恶魔爪击',g:'🩸',img:'assets/g3-demonkill.png'}, slay:{t:'猎人击杀',g:'🎯',img:'assets/mk-slayer.png'} };
  /* 与魔典一致的座位状态图标：[固定角度, 图片, 缩放, 光晕色] */
  const MARK={ poison:[60,'assets/mk-poison.png',1,'#3fd44f'], drunk:[90,'assets/s-drunk.png',1,'#ffe14d'],
    shield:[120,'assets/mk-shield.png',1,'#d8dae2'], crossbow:[150,'assets/mk-crossbow.png',1.2,'#4aa8ff'],
    dead:[30,'assets/mk-dead.png',1,'#000'], master:[0,'assets/mk-master.png',1.1,'#f5c542'], herring:[180,'assets/mk-herring.png',1.2,'#ff4a3a'] };

  function toast(m){ const t=document.getElementById('fbToast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
  function E(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function show(id,on){ const el=document.getElementById(id); if(el) el.classList.toggle('on',on); }
  window._closeGate=function(id){ show(id,false); };
  function pname(i){ return (pub&&pub.seats&&pub.seats[i]&&pub.seats[i].name)?pub.seats[i].name:('玩家'+(i+1)); }

  /* ---------- 模式切换 ---------- */
  function setMode(m){ mode=m;
    document.body.classList.toggle('mode-hall', m==='hall');
    document.body.classList.toggle('mode-notes', m==='notes');
    document.body.classList.toggle('st-mode', m==='st');
    document.body.classList.toggle('anon', role==='anon');   // 未登录：用暗色初始酒馆背景
    window.BOTC_VIEWER = (m!=='st');
    try{ if(window.updateBgm) updateBgm(); }catch(e){}   // 按登录状态切换背景音乐
    if(m==='st'){ try{ if(typeof render==='function') render(); }catch(e){} }
    else { const vt=document.getElementById('viewToggle');
      if(role==='player'){ if(vt) vt.style.display='none'; try{ updateRoleCard(curGid, window.__myRole||''); }catch(e){} }   // 玩家：右上角改为本局角色卡（无卡则空），不再显示魔典图标
      else { if(vt){ vt.style.display=''; vt.innerHTML='<img src="assets/book-closed.png" alt="魔典">'; } try{ if(window._clearRoleCard) _clearRoleCard(); }catch(e){} }
      const stg=document.getElementById('stage'); if(stg) stg.classList.remove('grim');   // 访客(大厅/玩家)始终用酒馆背景，绝不用魔典暗背景
      const bt=document.getElementById('bannerTitle'); if(bt) bt.textContent=(m==='notes'?'玩家笔记':'暗流涌动');
      renderView(); }
  }
  window._gotoHall=function(){ setMode('hall'); };

  /* ---------- 登录门 ---------- */
  window.onBookClick=function(){ if(role==='st'){ if(typeof setView==='function') setView(); return; } show('pGate',false); document.getElementById('stErr').textContent='';
    try{ const s=localStorage.getItem('botc_stid')||''; if(s) document.getElementById('stId').value=s; }catch(e){}
    document.getElementById('stRemember').checked=_remembered(); show('stGate',true);
    setTimeout(()=>document.getElementById(document.getElementById('stId').value?'stPw':'stId').focus(),60); };
  window.openPlayerGate=function(){
    if(role==='st'){   /* 说书人：墨水瓶切到「日志」页；再点回到之前的标签 */
      if(typeof setGtab==='function'){
        if(typeof gtab!=='undefined' && gtab==='log') setGtab(window.__prevGtab||'list');
        else { window.__prevGtab=(typeof gtab!=='undefined'?gtab:'list'); setGtab('log'); }
      }
      return; }
    if(role==='player'){ setMode(mode==='notes'?'hall':'notes'); return; }   /* 已登录：墨水瓶在笔记/大厅间来回切换 */
    show('stGate',false); document.getElementById('pErr').textContent='';
    try{ const sid=localStorage.getItem('botc_pid')||'', spw=localStorage.getItem('botc_ppw')||'';
      if(sid) document.getElementById('pId').value=sid; if(spw){ document.getElementById('pPw').value=spw; } document.getElementById('pRemember').checked=_remembered(); }catch(e){}
    show('pGate',true); setTimeout(()=>document.getElementById(document.getElementById('pId').value?'pPw':'pId').focus(),60); };

  function authErr(e){ const c=(e&&e.code)||''; if(c.includes('wrong-password')||c.includes('invalid-credential'))return'密码不对'; if(c.includes('email-already-in-use'))return'该 ID 已被占用'; if(c.includes('weak-password'))return'密码太弱（至少6位）'; if(c.includes('too-many'))return'尝试太频繁，稍后再试'; if(c.includes('network'))return'网络问题，稍后再试'; return'出错：'+c; }

  window._stLogin=async function(){ const id=document.getElementById('stId').value.trim().toLowerCase(), pw=document.getElementById('stPw').value, err=document.getElementById('stErr');
    if(!id){ err.textContent='请输入 ID'; return; }
    if(!/^[\p{L}\p{N}_]+$/u.test(id)){ err.textContent='ID 只能用中文/字母/数字/下划线（不能有空格）'; return; }
    err.textContent='登录中…'; try{ localStorage.setItem('botc_stid',id); }catch(e){}
    const rem=!!document.getElementById('stRemember').checked; await _setPersist(rem);
    const email=idToLocal(id)+ST_DOM, fpw=fbPw(pw);
    const done=()=>{ show('stGate',false); document.getElementById('stPw').value='';
      try{ if(rem){ localStorage.setItem('botc_stpw',pw); localStorage.setItem('botc_lastrole','st'); } else localStorage.removeItem('botc_stpw'); }catch(e){} };
    try{ await auth.signInWithEmailAndPassword(email,fpw); done(); }
    catch(e){ if((e.code||'').match(/user-not-found|invalid-credential/)){
        try{ await auth.createUserWithEmailAndPassword(email,fpw); await auth.currentUser.updateProfile({displayName:id}); toast('已创建说书人账号'); done(); }
        catch(e2){ err.textContent=(e2.code||'').includes('email-already-in-use')?'密码不对':authErr(e2); }
      } else err.textContent=authErr(e); } };

  /* 把 ID 转成 Firebase 邮箱能接受的本地部分：纯 ASCII 原样保留（老用户不变）；
     中文等非 ASCII 字符编码为 -<码点16进制>- ，'-' 在旧 ID 里不可能出现，故无冲突 */
  function idToLocal(id){ let s=id.replace(/[^a-z0-9_]/g, c=>'-'+c.codePointAt(0).toString(16)+'-');
    if(s.charAt(0)==='-') s='0'+s; if(s.charAt(s.length-1)==='-') s=s+'0'; return s; }
  window._pLogin=async function(){ const id=document.getElementById('pId').value.trim().toLowerCase(), pw=document.getElementById('pPw').value, err=document.getElementById('pErr');
    if(!id){ err.textContent='请输入 ID'; return; }
    if(!/^[\p{L}\p{N}_]+$/u.test(id)){ err.textContent='ID 只能用中文/字母/数字/下划线（不能有空格）'; return; }
    err.textContent='核对名单…';
    const allowed=await window._checkRoster(id);
    if(!allowed){ err.textContent='你不在本局客人名册里，请让说书人先把你加进去'; return; }
    const email=idToLocal(id)+PLAYER_DOM, fpw=fbPw(pw); err.textContent='登录中…'; try{ localStorage.setItem('botc_pid',id); }catch(e){}
    const rem=!!document.getElementById('pRemember').checked; await _setPersist(rem);
    const done=()=>{ show('pGate',false); try{ if(rem){ localStorage.setItem('botc_ppw',pw); localStorage.setItem('botc_lastrole','player'); } else localStorage.removeItem('botc_ppw'); }catch(e){} document.getElementById('pPw').value=''; try{ window._recordAccount(id); }catch(e){} };
    try{ await auth.signInWithEmailAndPassword(email,fpw); done(); }
    catch(e){ if((e.code||'').match(/user-not-found|invalid-credential/)){
        try{ await auth.createUserWithEmailAndPassword(email,fpw); await auth.currentUser.updateProfile({displayName:id}); toast('已创建你的笔记本'); done(); }
        catch(e2){ err.textContent=authErr(e2); }
      } else err.textContent=authErr(e); } };

  window._logout=function(){ try{ localStorage.removeItem('botc_ppw'); localStorage.removeItem('botc_stpw'); localStorage.removeItem('botc_lastrole'); localStorage.setItem('botc_remember',''); }catch(e){} auth.signOut(); };

  /* 重置我的密码：仅能重置“当前已登录的账号”的密码（Firebase 需登录态；忘记密码无法在客户端重置） */
  window._openResetPw=function(){ const f=document.getElementById('rpForm'); if(!f) return;
    f.style.display = f.style.display==='none' ? 'flex' : 'none';
    if(f.style.display!=='none'){ const u=auth.currentUser, err=document.getElementById('rpErr'); err.textContent='';
      if(u){ document.getElementById('rpId').value=u.displayName||''; document.getElementById('rpRole').value=(u.email||'').endsWith(ST_DOM)?'st':'player'; }
      else err.textContent='请先登录你的账号，再重置密码'; } };
  window._doResetPw=async function(){ const err=document.getElementById('rpErr'); err.textContent='';
    const id=(document.getElementById('rpId').value||'').trim().toLowerCase(), npw=document.getElementById('rpPw').value;
    const wantRole=document.getElementById('rpRole').value;
    if(!id){ err.textContent='请输入 ID'; return; }
    const u=auth.currentUser;
    if(!u){ err.textContent='请先登录该账号（用旧密码），再来重置'; return; }
    const curRole=(u.email||'').endsWith(ST_DOM)?'st':'player', curId=(u.displayName||'').toLowerCase();
    if(curRole!==wantRole || (curId&&curId!==id)){ err.textContent='只能重置当前登录的账号：'+(curRole==='st'?'说书人':'玩家')+' '+(u.displayName||''); return; }
    err.textContent='重置中…';
    try{ await u.updatePassword(fbPw(npw));
      try{ if(_remembered()){ if(curRole==='st') localStorage.setItem('botc_stpw',npw); else localStorage.setItem('botc_ppw',npw); } }catch(e){}
      err.textContent=''; document.getElementById('rpPw').value=''; document.getElementById('rpForm').style.display='none'; toast('✅ 密码已重置');
    }catch(e){ err.textContent=(e.code||'').includes('requires-recent-login') ? '为安全起见，请退出后用旧密码重新登录，再来重置' : ('重置失败：'+(e.code||e.message||'')); } };

  /* 记住登录：本标签页若未登录，用本地保存的凭据自动登录（各标签页独立，互不影响） */
  async function _autoLogin(){ try{ if(!_remembered()||auth.currentUser) return;
    const role=localStorage.getItem('botc_lastrole')||'';
    if(role==='st'){ const id=_storedId('botc_stid'); if(!id) return; await auth.signInWithEmailAndPassword(idToLocal(id)+ST_DOM, fbPw(localStorage.getItem('botc_stpw')||'')); }
    else if(role==='player'){ const id=_storedId('botc_pid'); if(!id) return; await auth.signInWithEmailAndPassword(idToLocal(id)+PLAYER_DOM, fbPw(localStorage.getItem('botc_ppw')||'')); }
  }catch(e){} }

  /* ---------- 认证状态 ---------- */
  let _autoTried=false;
  AUTH_READY.then(()=>auth.onAuthStateChanged(user=>{ me=user;
    if(!user){ role='anon'; document.getElementById('stBadge').classList.remove('on'); document.body.classList.remove('pl'); if(notesRef){notesRef.off();notesRef=null;} S=null; setMode('hall');
      if(!_autoTried){ _autoTried=true; _autoLogin(); }   // 首次未登录时才尝试记住的自动登录
      return; }
    _autoTried=true;
    if((user.email||'').endsWith(ST_DOM)){ role='st'; enterSt(); }
    else { role='player'; enterPlayer(); }

      if(typeof tokens!=='undefined') tokens.forEach(t=>{ if(t.seat!==null&&t.seat>=N) t.seat=null; });
      if(typeof ensureMeta==='function') ensureMeta();
      for(let k=0;k<N;k++){ if(meta[k]){ meta[k].role=rs[k].r; meta[k].isDrunk=!!rs[k].d; } }
      customDist=c.dist?c.dist.slice():null;
    } else {   // 兼容旧存档（只有阵营数量）
      N=Math.max(5,Math.min(15,c.N||N)); if(typeof ensureMeta==='function') ensureMeta();
      customDist=c.dist?c.dist.slice():null; if(c.locked) lockedRoles=new Set(c.locked);
    }
    try{ save(); }catch(e){} try{ render(); }catch(e){} _cfgClose(); toast('已载入：'+c.name);
  };
  window._cfgDel=async function(i){ let ok=true; try{ ok=await uiConfirm('删除这个存档？'); }catch(e){} if(!ok) return; const a=_cfgLoadAll(); a.splice(i,1); _cfgSaveAll(a); renderCfgList(); };

  window.addEventListener('resize',()=>{ if(mode!=='st'){ drawSeats(); if(window.renderClock) renderClock(); } });
})();
</script>
</body>
</html>
