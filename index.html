<!-- ================= 多人版逻辑 ================= -->
<script>
(function(){
  const auth=firebase.auth(), db=firebase.database();
  const AUTH_READY = auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
  let me=null, role='anon', mode='hall', curGid=null, pub=null, S=null, sel=null, nbTab='mark';
  let notesRef=null, pubBound=null;

  const BADGE={ dead:{g:'💀',t:'出局'}, poison:{g:'🧪',t:'中毒'}, drunk:{g:'🍺',t:'醉酒'}, shield:{g:'🛡️',t:'守护'}, crossbow:{g:'🏹',t:'已开枪'}, master:{g:'👑',t:'主人'}, herring:{g:'🐟',t:'红鲱鱼'} };
  const STAT_ORDER=['poison','drunk','shield','crossbow','herring','master'];
  const CAUSE={ exec:{t:'处决',g:'⚖️',img:'assets/s-execution.png'}, claw:{t:'恶魔爪击',g:'🩸',img:'assets/g3-demonkill.png'}, slay:{t:'猎人击杀',g:'🎯',img:'assets/mk-slayer.png'} };
  /* 与魔典一致的座位状态图标：[固定角度, 图片, 缩放, 光晕色] */
  const MARK={ poison:[60,'assets/mk-poison.png',1,'#3fd44f'], drunk:[90,'assets/s-drunk.png',1,'#ffe14d'],
    shield:[120,'assets/mk-shield.png',1,'#d8dae2'], crossbow:[150,'assets/mk-crossbow.png',1.2,'#4aa8ff'],
    dead:[30,'assets/mk-dead.png',1,'#000'], master:[0,'assets/mk-master.png',1.1,'#f5c542'], herring:[180,'assets/mk-herring.png',1.2,'#ff4a3a'] };

  function toast(m){ const t=document.getElementById('fbToast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
  function E(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function show(id,on){ const el=document.getElementById(id); if(el) el.classList.toggle('on',on); }
  window._closeGate=function(id){ show(id,false); };
  function pname(i){ return (pub&&pub.seats&&pub.seats[i]&&pub.seats[i].name)?pub.seats[i].name:('玩家'+(i+1)); }

  /* ---------- 模式切换 ---------- */
  function setMode(m){ mode=m;
    document.body.classList.toggle('mode-hall', m==='hall');
    document.body.classList.toggle('mode-notes', m==='notes');
    document.body.classList.toggle('st-mode', m==='st');
    window.BOTC_VIEWER = (m!=='st');
    if(m==='st'){ try{ if(typeof render==='function') render(); }catch(e){} }
    else { const vt=document.getElementById('viewToggle'); if(vt) vt.innerHTML='<img src="assets/book-closed.png" alt="魔典">'; renderView(); }
  }
  window._gotoHall=function(){ setMode('hall'); };

  /* ---------- 登录门 ---------- */
  window.onBookClick=function(){ if(role==='st'){ if(typeof setView==='function') setView(); return; } show('pGate',false); document.getElementById('stErr').textContent=''; show('stGate',true); setTimeout(()=>document.getElementById('stPw').focus(),60); };
  window.openPlayerGate=function(){ if(role==='player'){ setMode('notes'); return; } show('stGate',false); document.getElementById('pErr').textContent='';
    try{ const sid=localStorage.getItem('botc_pid')||'', spw=localStorage.getItem('botc_ppw')||'';
      if(sid) document.getElementById('pId').value=sid; if(spw){ document.getElementById('pPw').value=spw; document.getElementById('pRemember').checked=true; } }catch(e){}
    show('pGate',true); setTimeout(()=>document.getElementById(document.getElementById('pId').value?'pPw':'pId').focus(),60); };

  function authErr(e){ const c=(e&&e.code)||''; if(c.includes('wrong-password')||c.includes('invalid-credential'))return'密码不对'; if(c.includes('email-already-in-use'))return'该 ID 已被占用'; if(c.includes('weak-password'))return'密码太弱（至少6位）'; if(c.includes('too-many'))return'尝试太频繁，稍后再试'; if(c.includes('network'))return'网络问题，稍后再试'; return'出错：'+c; }

  window._stLogin=async function(){ const pw=document.getElementById('stPw').value, err=document.getElementById('stErr');
    if(!pw){ err.textContent='请输入密码'; return; } if(pw.length<6){ err.textContent='密码至少 6 位'; return; } err.textContent='登录中…';
    const done=()=>{ show('stGate',false); document.getElementById('stPw').value=''; };
    try{ await auth.signInWithEmailAndPassword(ST_EMAIL,pw); done(); }
    catch(e){ if((e.code||'').match(/user-not-found|invalid-credential/)){
        try{ await auth.createUserWithEmailAndPassword(ST_EMAIL,pw); toast('已设定说书人密码'); done(); }
        catch(e2){ err.textContent=(e2.code||'').includes('email-already-in-use')?'密码不对':authErr(e2); }
      } else err.textContent=authErr(e); } };

  window._pLogin=async function(){ const id=document.getElementById('pId').value.trim().toLowerCase(), pw=document.getElementById('pPw').value, err=document.getElementById('pErr');
    if(!id||!pw){ err.textContent='请输入 ID 和密码'; return; } if(pw.length<6){ err.textContent='密码至少 6 位'; return; }
    if(!/^[a-z0-9_]+$/.test(id)){ err.textContent='ID 只能用字母数字下划线'; return; }
    const email=id+PLAYER_DOM; err.textContent='登录中…';
    const done=()=>{ show('pGate',false); try{ localStorage.setItem('botc_pid',id); if(document.getElementById('pRemember').checked) localStorage.setItem('botc_ppw',pw); else localStorage.removeItem('botc_ppw'); }catch(e){} document.getElementById('pPw').value=''; };
    try{ await auth.signInWithEmailAndPassword(email,pw); done(); }
    catch(e){ if((e.code||'').match(/user-not-found|invalid-credential/)){
        try{ await auth.createUserWithEmailAndPassword(email,pw); await auth.currentUser.updateProfile({displayName:id}); toast('已创建你的笔记本'); done(); }
        catch(e2){ err.textContent=authErr(e2); }
      } else err.textContent=authErr(e); } };

  window._logout=function(){ try{ localStorage.removeItem('botc_ppw'); }catch(e){} auth.signOut(); };

  /* ---------- 认证状态 ---------- */
  AUTH_READY.then(()=>auth.onAuthStateChanged(user=>{ me=user;
    if(!user){ role='anon'; document.getElementById('stBadge').classList.remove('on'); if(notesRef){notesRef.off();notesRef=null;} S=null; setMode('hall'); return; }
    if(user.email===ST_EMAIL){ role='st'; enterSt(); }
    else { role='player'; enterPlayer(); }
  }));
  function enterSt(){ document.getElementById('stBadge').classList.add('on'); db.ref('storytellerUid').transaction(c=>c||me.uid).catch(()=>{}); setMode('st'); }
  function enterPlayer(){ document.getElementById('stBadge').classList.remove('on'); document.getElementById('pbName').textContent=(me.displayName||'玩家'); bindNotes(); setMode('notes'); }
  function bindNotes(){ if(notesRef){ notesRef.off(); notesRef=null; } if(role==='player'&&me&&curGid){ notesRef=db.ref('games/'+curGid+'/players/'+me.uid); notesRef.on('value',s=>{ S=s.val(); ensureS(); if(mode==='notes') renderView(); }); } }

  /* ---------- 当前牌局 / 公开数据订阅 ---------- */
  db.ref('currentGame').on('value', s=>{ const gid=s.val(); if(gid===curGid) return; curGid=gid; bindPub(); if(role==='player') bindNotes(); });
  function bindPub(){ if(pubBound){pubBound.off();pubBound=null;} if(!curGid){ pub=null; if(mode!=='st') renderView(); return; }
    pubBound=db.ref('games/'+curGid+'/public'); pubBound.on('value',s=>{ pub=s.val(); ensureS(); if(mode!=='st') renderView(); }); }

  /* ---------- 渲染分发 ---------- */
  function renderView(){ if(mode==='hall') renderHall(); else if(mode==='notes') renderNotes(); drawSeats(); }

  /* ---------- 座位圈（访客，复刻说书人比例，画进 #tableZone） ---------- */
  function drawSeats(){ if(mode==='st') return; const zone=document.getElementById('tableZone'); if(!zone) return; zone.innerHTML='';
    if(!pub||!pub.count) return;
    const stage=document.getElementById('stage'); const SW=stage.clientWidth, SH=stage.clientHeight;
    const zoneLeft=0.40*SW, zoneTop=0.08*SH, cx=SW*0.71-zoneLeft, cy=SH*0.525-zoneTop, R=SH*0.34;
    const N=pub.count, seats=pub.seats||[]; const seatD=Math.max(R*0.26, Math.min(R*0.78, R*3.8/N));
    const numD=seatD*0.46, numF=numD*0.6, nmF=Math.max(11,seatD*0.24), rF=Math.max(9,seatD*0.17);
    for(let i=0;i<N;i++){ const ps=seats[i]||{}, ang=-Math.PI/2+i*2*Math.PI/N, x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
      const mine=(mode==='notes'&&S&&S.seats)?(S.seats[i]||{}):null, dead=!!ps.dead;
      const s=document.createElement('div'); s.className='seat filled'+(dead?' dead hascause':''); s.style.cssText='left:'+x+'px;top:'+y+'px;width:'+seatD+'px;height:'+seatD+'px';
      let h='<div class="num" style="width:'+numD+'px;height:'+numD+'px;font-size:'+numF+'px">'+(i+1)+'</div>';
      h+='<div class="nm" style="font-size:'+nmF+'px">'+(E(ps.name)||'<span style=\"opacity:.5\">空</span>')+'</div>';
      const rid=mine&&mine.role; if(rid&&RMAP[rid]) h+='<div class="vrole" style="font-size:'+rF+'px;color:'+TEAMC[RMAP[rid].team]+'">'+RMAP[rid].name+'</div>';
      s.innerHTML=h;
      if(dead&&ps.cause&&CAUSE[ps.cause]) s.style.background="url('"+CAUSE[ps.cause].img+"') center / 70% no-repeat, radial-gradient(circle at 50% 35%, rgba(48,34,58,.9), rgba(22,15,30,.95))";
      const marks=(mine&&mine.status)?mine.status.slice():[];
      if(dead && marks.indexOf('dead')<0) marks.push('dead');   // 出局也用魔典的骷髅图标
      const r=seatD/2, bD=Math.max(18, seatD*0.24)*1.1, dist=r*1.3; let bhtml='';
      ['dead','poison','drunk','shield','crossbow','master','herring'].forEach(k=>{ if(marks.indexOf(k)<0) return; const m2=MARK[k]; if(!m2) return;
        const bd=bD*(m2[2]||1), a=m2[0]*Math.PI/180, bx=r+dist*Math.sin(a), by=r-dist*Math.cos(a);
        bhtml+='<div class="shieldbadge" title="'+k+'" style="width:'+bd+'px;height:'+bd+'px;left:'+(bx-bd/2)+'px;top:'+(by-bd/2)+'px;filter:drop-shadow(0 0 2px '+m2[3]+') drop-shadow(0 0 4px '+m2[3]+');"><img src="'+m2[1]+'"></div>'; });
      if(bhtml) s.insertAdjacentHTML('beforeend', bhtml);
      if(mode==='notes'){ s.style.cursor='pointer'; s.addEventListener('click',()=>seatTap(i)); }
      zone.appendChild(s);
    }
  }

  /* ---------- 大厅 ---------- */
  function renderHall(){ const nl=document.getElementById('hallNames'), lg=document.getElementById('hallLog'); if(!nl) return;
    document.getElementById('hallTitle').textContent = pub?('客人名单 · '+(pub.name||'本局')+' · 第'+(pub.day||1)+'天'):'客人名单';
    if(!pub||!pub.count){ nl.innerHTML='<div style="color:#9a7c4a;font-size:12px;padding:6px">🕯️ 说书人还没开局</div>'; if(lg) lg.innerHTML=''; return; }
    const seats=pub.seats||[];
    nl.innerHTML=seats.map((s,i)=>'<div class="nameitem'+(s.dead?' dead':'')+'"><span class="no">'+(i+1)+'</span>'+(E(s.name)||'—')+(s.dead&&CAUSE[s.cause]?'<span class="cz">'+CAUSE[s.cause].g+'</span>':'')+'</div>').join('');
    if(lg) lg.innerHTML=nomLogHTML();
  }
  function nomLogHTML(){ const noms=(pub&&pub.noms)||[], days={}; noms.forEach(n=>{(days[n.day]=days[n.day]||[]).push(n);});
    const keys=Object.keys(days).sort((a,b)=>a-b);
    if(!keys.length) return '<div style="color:#9a7c4a;font-size:12px;padding:4px">还没有公布记录。说书人会在天亮后公布。</div>';
    let h=''; keys.forEach(d=>{ h+='<div class="nb-sec" style="color:inherit;font-weight:800;margin:6px 0 3px">第 '+d+' 天</div>';
      days[d].forEach(n=>{ h+='<div class="nb-note">'+E(pname(n.by))+' 提名 ▸ '+E(pname(n.to))+' · '+((n.voters||[]).length)+'票'+(n.exec?' · <span style="color:#b0402e;font-weight:700">处决</span>':'')+'</div>'; }); });
    return h;
  }

  /* ---------- 玩家笔记 ---------- */
  window._nbTab=function(t){ nbTab=t; ['mark','nom','ref'].forEach(x=>document.getElementById('nb-'+x).classList.toggle('on',x===t)); renderNotes(); };
  function renderNotes(){ const c=document.getElementById('nbContent'); if(!c) return;
    if(!pub||!pub.count){ c.innerHTML='<div style="padding:8px;color:#9a7c4a;font-size:12px">🕯️ 说书人还没开局</div>'; return; }
    ensureS();
    if(nbTab==='mark') c.innerHTML=markTabHTML(); else if(nbTab==='nom') c.innerHTML=nomLogHTML(); else c.innerHTML=refHTML();
  }
  function markTabHTML(){ let h='<div class="nb-sec">状态标记 · 点标记再点座位</div><div>';
    h+=STAT_ORDER.map(k=>{ const b=BADGE[k], on=sel&&sel.type==='stat'&&sel.val===k; const ic=MARK[k]?'<img src="'+MARK[k][1]+'" style="width:17px;height:17px;vertical-align:middle;margin-right:2px">':b.g; return '<span class="nbtok '+(on?'on':'')+'" onclick="_nbPick(\''+'stat'+'\',\''+k+'\')">'+ic+b.t+'</span>'; }).join('')+'</div>';
    h+='<div class="nb-sec">在场角色 · 点角色再点座位记录猜测</div><div>';
    const rs=pub.roleset||[], used={}; (S.seats||[]).forEach(s=>{ if(s&&s.role) used[s.role]=true; });
    h+=rs.map(id=>{ const r=RMAP[id]; if(!r) return ''; const on=sel&&sel.type==='role'&&sel.val===id;
      return '<span class="nbtok '+(on?'on':'')+' '+(used[id]?'used':'')+'" style="color:'+(on?'':TEAMC[r.team])+'" onclick="_nbPick(\''+'role'+'\',\''+id+'\')">'+r.name+'</span>'; }).join('')+'</div>';
    h+='<div class="nb-sec">我的座位备注</div>';
    let any=false; (S.seats||[]).forEach((st,i)=>{ if(st&&st.note){ any=true; h+='<div class="nb-note"><b>'+(i+1)+' '+E(pname(i))+'</b>：'+E(st.note)+'</div>'; } });
    if(!any) h+='<div style="font-size:11px;color:#8a6b3a">还没有备注</div>';
    h+='<div style="font-size:11px;color:#6a4e8f;margin-top:8px;line-height:1.5">提示：直接点座位=写备注；先点上面标记/角色，再点座位=贴上或取消。</div>';
    return h;
  }
  function refHTML(){ const rs=pub.roleset||[], d=pub.dist||[0,0,0,0];
    let h='<div class="nb-role"><b>本局 · 第'+(pub.day||1)+'天</b><br>'+pub.count+'人 · 镇民'+d[0]+' 外来者'+d[1]+' 爪牙'+d[2]+' 恶魔'+d[3]+'</div>';
    h+='<div class="nb-sec">本局可能出现的角色（不代表谁是谁）</div>';
    ORDER.forEach(t=>{ const list=rs.map(id=>RMAP[id]).filter(r=>r&&r.team===t); if(!list.length) return;
      h+='<div style="font-weight:800;color:'+TEAMC[t]+';margin:8px 0 3px">'+TEAMLABEL[t]+'</div>';
      list.forEach(r=>h+='<div class="nb-role"><b style="color:'+TEAMC[t]+'">'+r.name+'</b><div style="color:#6a4e8f;margin-top:2px">'+E(r.ab||'')+'</div></div>'); });
    return h;
  }
  window._nbPick=function(type,val){ if(sel&&sel.type===type&&sel.val===val) sel=null; else sel={type,val}; renderNotes(); drawSeats(); };
  function seatTap(i){ if(!sel){ openNote(i); return; } const s=S.seats[i];
    if(sel.type==='role') s.role=(s.role===sel.val?'':sel.val);
    else { const k=s.status.indexOf(sel.val); if(k<0) s.status.push(sel.val); else s.status.splice(k,1); }
    sel=null; saveNotes(); renderNotes(); drawSeats(); }
  function openNote(i){ const s=S.seats[i]; const v=prompt('座位 '+(i+1)+' · '+pname(i)+'　备注：', s.note||''); if(v===null) return; s.note=v; saveNotes(); renderNotes(); drawSeats(); }
  function ensureS(){ const n=(pub&&pub.count)||0; if(!S) S={seats:[],v:1}; if(!S.seats) S.seats=[]; for(let i=0;i<n;i++){ if(!S.seats[i]) S.seats[i]={role:'',status:[],note:''}; if(!S.seats[i].status) S.seats[i].status=[]; } }
  function saveNotes(){ if(notesRef&&S) notesRef.set(S).catch(e=>toast('保存失败：'+(e.code||''))); }

  /* ---------- 说书人：从本地状态构建公开数据 ---------- */
  function buildPublic(){ const seats=[];
    for(let i=0;i<N;i++){ const t=seatToken(i); let cause='';
      for(const dd in executions){ if(executions[dd]===i) cause='exec'; }
      if(!cause && slayerShot && slayerShot.seat===i) cause='slay';
      const dead=!!(t&&t.dead); if(dead&&!cause) cause='claw';
      seats.push({ name:(t&&t.name)?t.name:'', dead:dead, cause:cause });
    }
    const gs=gameOverviewSet(), roleset=[]; ORDER.forEach(tm=>{ ROLES.filter(r=>r.team===tm&&gs.has(r.id)).forEach(r=>roleset.push(r.id)); });
    const noms=[]; Object.keys(nominations).forEach(dd=>{ (nominations[dd]||[]).forEach(nm=>{ noms.push({day:+dd,by:nm.nominator,to:nm.nominee,voters:(nm.voters||[]).slice(),exec:executions[dd]===nm.nominee}); }); });
    return { name:(window.__botcGameName||'本局'), count:N, day:night, seats:seats, roleset:roleset, dist:(customDist||DIST[N]||[0,0,0,0]), noms:noms };
  }
  window.stNewGame=async function(){ if(role!=='st'){ toast('请先以说书人登录（点📖）'); return; }
    let nm='本局'; try{ nm=await uiPrompt('给这局起个名字（玩家会看到）：','本局',{title:'开新局'}); if(nm===null) return; }catch(e){}
    window.__botcGameName=nm||'本局'; const gid='t'+Date.now(), p=buildPublic();
    try{ await db.ref('storytellerUid').set(me.uid); await db.ref('games/'+gid+'/public').set(p); await db.ref('currentGame').set(gid); toast('✅ 已开新局并同步'); }
    catch(e){ toast('开局失败：'+(e.code||e.message||'')); } };
  window.stSyncSeats=async function(){ if(role!=='st'){ toast('请先登录说书人'); return; } if(!curGid){ toast('先点开新局'); return; }
    const p=buildPublic(); try{ await db.ref('games/'+curGid+'/public').update({seats:p.seats,count:p.count,roleset:p.roleset,dist:p.dist,day:p.day}); toast('↻ 座位/名单已同步'); }
    catch(e){ toast('同步失败：'+(e.code||'')); } };
  window.stPublish=async function(){ if(role!=='st'){ toast('请先登录说书人'); return; } if(!curGid){ toast('先点开新局'); return; }
    const p=buildPublic(); try{ await db.ref('games/'+curGid+'/public').update({seats:p.seats,noms:p.noms,day:p.day,count:p.count}); toast('📣 已公布第 '+p.day+' 天'); }
    catch(e){ toast('公布失败：'+(e.code||'')); } };

  /* ---------- 名单实时自动同步（说书人改动→自动推送公开名单，不含死亡/提名） ---------- */
  let _syncT=null;
  function autoSyncPublic(){ if(role!=='st'||!curGid||!me) return; clearTimeout(_syncT); _syncT=setTimeout(()=>{
    try{ const base='games/'+curGid+'/public/'; const updates={};
      for(let i=0;i<N;i++){ const t=seatToken(i); updates[base+'seats/'+i+'/name']=(t&&t.name)?t.name:''; }
      updates[base+'count']=N;
      const gs=gameOverviewSet(); const roleset=[]; ORDER.forEach(tm=>ROLES.filter(r=>r.team===tm&&gs.has(r.id)).forEach(r=>roleset.push(r.id)));
      updates[base+'roleset']=roleset; updates[base+'dist']=(customDist||DIST[N]||[0,0,0,0]);
      db.ref().update(updates).catch(()=>{});
    }catch(e){}
  }, 500); }
  if(typeof window.save==='function'){ const _origSave=window.save; window.save=function(){ const r=_origSave.apply(this,arguments); try{ autoSyncPublic(); }catch(e){} return r; }; }

  window.addEventListener('resize',()=>{ if(mode!=='st') drawSeats(); });
})();
</script>
</body>
