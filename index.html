<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
  /* Firebase 配置（可公开；真正防护是数据库安全规则）。项目 botc-clocktower-38b2d */
  const firebaseConfig = {
    apiKey: "AIzaSyAU4amgRlYwpEH5ntvmVLqSL34UVS-CSvk",
    authDomain: "botc-clocktower-38b2d.firebaseapp.com",
    databaseURL: "https://botc-clocktower-38b2d-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "botc-clocktower-38b2d",
    storageBucket: "botc-clocktower-38b2d.firebasestorage.app",
    messagingSenderId: "599501443696",
    appId: "1:599501443696:web:4db22642a68e8642d25ab5"
  };
  try { firebase.initializeApp(firebaseConfig); } catch(e){ console.warn('firebase init', e); }
  /* 登录用的隐藏邮箱域（玩家只输 ID，不涉及真实邮箱） */
  const ST_EMAIL   = "storyteller@st.botc-clocktower.app";  // 固定说书人账号
  const PLAYER_DOM = "@p.botc-clocktower.app";               // 玩家 ID + 此域
  /* 访客模式开关：默认 true，说书人本地渲染在确认身份前不运行，避免与大厅/玩家渲染冲突 */

<style>
  :root{ --purple:#4a2b6b; --gold:#b8860b; --ink:#3a2a12; --parch:#f3e6c4; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:#1a1220;color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;
  }
  .stage{
    position:relative; width:min(100vw, 177.78vh); height:min(56.25vw, 100vh);
    background:#000 center/100% 100% no-repeat; background-image:url("assets/tavern-bg.jpg");
    box-shadow:0 0 60px rgba(0,0,0,.6); overflow:hidden;
  }
  /* dark layer over the tavern (right side) for grimoire mode */
  /* 魔典视图：整张换成暗色实景背景 */
  .stage.grim{background-image:url("assets/tavern-bg-dark.jpg"); background-position:center; background-size:100% 100%;}
  .darklayer{position:absolute; left:36%; top:0; width:64%; height:100%;
    background:rgba(6,3,14,.45); opacity:0; transition:opacity .25s; pointer-events:none;}
  .stage.grim .darklayer{opacity:0;}
  .stage:not(.grim) .grim-only{display:none;}
  .stage.grim .seat-only{display:none;}

  /* view toggle icon (top-right) */
  .view-toggle{position:absolute; top:2.5%; right:2%; z-index:30;
    width:clamp(50px,5.52vw,86px); height:clamp(50px,5.52vw,86px);
    border:none; background:transparent; cursor:pointer; padding:0;
    outline:none; -webkit-tap-highlight-color:transparent; appearance:none; -webkit-appearance:none;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.6)); transition:transform .12s;}
  .view-toggle:hover{transform:scale(1.08);}
  .view-toggle:focus,.view-toggle:focus-visible,.view-toggle:active{outline:none; box-shadow:none;}
  /* 暗流涌动界面（书页合上）按钮：往左下移动一点 */
  .stage:not(.grim) .view-toggle{top:3.5%; right:2.5%;}
  /* 魔典界面（书页打开）按钮放大 20% */
  .stage.grim .view-toggle{width:clamp(60px,6.62vw,103px); height:clamp(60px,6.62vw,103px);}
  .view-toggle img{width:100%; height:100%; object-fit:contain; display:block;}
  /* 网页全屏按钮 */
  .fsbtn{position:fixed; top:12px; left:12px; z-index:60; width:clamp(30px,2.6vw,40px); height:clamp(30px,2.6vw,40px);
    border-radius:9px; border:1px solid rgba(233,196,106,.55); background:rgba(24,16,36,.62); color:#e9c46a;
    font-size:clamp(15px,1.5vw,20px); line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .12s, box-shadow .12s, background .12s;}
  .fsbtn:hover{background:rgba(58,45,78,.85); transform:translateY(-1px); box-shadow:0 0 10px rgba(233,196,106,.4);}
  .fsbtn:active{transform:scale(.94);}

  .banner-title{
    position:absolute; left:6.5%; top:13%; width:27%; height:7.5%;
    display:flex; align-items:center; justify-content:center; z-index:4;
    font-weight:800; color:#5a3d16; letter-spacing:3px;
    font-size:clamp(11px,1.35vw,21px); text-shadow:0 1px 0 rgba(255,255,255,.5);
  }

  /* ======= LEFT (seat view): ledger ======= */
  .ledger{position:absolute; left:8.3%; top:23.5%; width:23.4%; height:54.7%;
    display:flex; flex-direction:column; gap:1.3%; color:var(--ink);}
  .box{border:none; background:transparent; padding:4px 6px; display:flex; flex-direction:column; min-height:0;}
  .box.grow{flex:1;}
  .box-h{text-align:center; font-weight:800; color:#6b4a1e; letter-spacing:1px;
    font-size:clamp(10px,1.05vw,15px); padding-bottom:4px; flex:0 0 auto;}
  .list{flex:1; min-height:0; overflow:auto; display:flex; flex-wrap:wrap; gap:5px; align-content:flex-start;}
  .list.over{outline:2px dashed var(--gold); outline-offset:-2px; background:rgba(255,245,210,.45);}
  .list::-webkit-scrollbar{width:6px;} .list::-webkit-scrollbar-thumb{background:rgba(122,83,32,.35); border-radius:3px;}
  .empty-hint{color:#9a7c4a; font-size:clamp(9px,.95vw,13px); padding:3px 4px; width:100%;}
  .add{display:flex; gap:6px; align-items:center;}
  .add input{flex:1; min-width:0; padding:6px 9px; font-size:clamp(11px,1.05vw,14px);
    border:1px solid rgba(122,83,32,.5); border-radius:7px; background:rgba(255,252,244,.75); color:var(--ink); font-family:inherit;}
  .add input:focus{outline:none; border-color:var(--gold); background:#fffdf7;}
  .add button{padding:6px 12px; font-size:clamp(11px,1.05vw,14px); font-weight:700; border:none; border-radius:7px;
    cursor:pointer; background:#6b4a1e; color:#f3e6c4; white-space:nowrap;}
  .add button:hover{background:#8a5f28;}
  .chip{display:inline-flex; align-items:center; gap:4px; height:fit-content;
    background:rgba(255,250,235,.9); border:1px solid rgba(122,83,32,.45); border-radius:16px; padding:3px 6px 3px 10px;
    font-size:clamp(12px,1.25vw,16px); cursor:grab; user-select:none; white-space:nowrap; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .chip.sel{background:var(--gold); color:#fff; border-color:var(--gold);}
  .chip.seated{opacity:.42; cursor:grab;}
  .chip .x{cursor:pointer; font-size:1.05em; line-height:1; color:#a5744a; border-radius:50%; width:14px; height:14px; display:inline-flex; align-items:center; justify-content:center;}
  .chip .x:hover{background:#b0402e; color:#fff;}
  .chip.sel .x{color:#fff3d8;}
  .ptag{font-size:clamp(11px,1.2vw,15px); padding:2px 8px; border-radius:14px; height:fit-content;
    border:1px dashed rgba(122,83,32,.45); background:rgba(255,250,235,.4); color:#6b4a1e; cursor:pointer; user-select:none; white-space:nowrap;}
  .ptag:hover{background:#6b4a1e; color:#f3e6c4;}
  .ptag.active{opacity:.4; cursor:default;}
  .ptag.active:hover{background:rgba(255,250,235,.4); color:#6b4a1e;}
  .ptag .del{margin-left:4px; color:#a5744a;} .ptag .del:hover{color:#b0402e;}

  /* shared bottom bar */
  .bottom-bar{flex-direction:row; align-items:center; gap:8px; flex:0 0 auto;}
  .count{display:flex; align-items:center; gap:5px; flex:0 0 auto;}
  .count .lab{font-size:clamp(10px,1.05vw,15px); font-weight:800; color:#6b4a1e; white-space:nowrap;}
  .count button{width:clamp(22px,2vw,30px); height:clamp(22px,2vw,30px); font-size:clamp(14px,1.4vw,19px); line-height:1;
    border:1px solid rgba(122,83,32,.5); background:rgba(255,250,235,.6); border-radius:7px; cursor:pointer; color:#6b4a1e; font-weight:700;}
  .count button:hover{background:#6b4a1e; color:#f3e6c4;}
  .cv{font-size:clamp(15px,1.6vw,22px); font-weight:800; min-width:26px; text-align:center; color:#5a3d16;}
  .btn{flex:1; min-width:0; padding:7px 4px; border:none; border-radius:8px; font-size:clamp(10px,1vw,13px);
    font-weight:700; cursor:pointer; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .btn.gold{background:var(--gold); color:#fff;} .btn.purple{background:var(--purple); color:#fff;}
  .btn.ghost{background:rgba(107,74,30,.9); color:#f3e6c4;} .btn:hover{filter:brightness(1.08);}

  /* ======= LEFT (grimoire view) ======= */
  .grimoire{position:absolute; left:8.3%; top:23.5%; width:23.4%; height:54.7%;
    display:flex; flex-direction:column; gap:6px; color:var(--ink);}
  .gtabs{display:flex; gap:4px; flex:0 0 auto;}
  .gtabs button{flex:1; padding:5px 2px; font-size:clamp(9px,.95vw,13px); font-weight:800;
    border:1px solid rgba(74,43,107,.4); background:rgba(240,235,250,.6); color:#43286b; border-radius:6px; cursor:pointer;}
  .gtabs button.on{background:#b9a0d6; color:#2e1a47;}
  .gcontent{flex:1; min-height:0; overflow:auto; padding-right:3px; font-size:clamp(10px,1vw,13px); color:#43286b;}
  .gcontent::-webkit-scrollbar{width:6px;} .gcontent::-webkit-scrollbar-thumb{background:rgba(74,43,107,.35); border-radius:3px;}
  .gsec{font-weight:800; color:#43286b; margin:7px 0 3px; letter-spacing:1px; font-size:clamp(10px,1.02vw,14px);}
  .stage.grim .banner-title{color:#43286b; text-shadow:0 1px 0 rgba(255,255,255,.35);}
  .grimoire .count .lab{color:#43286b;}
  .grimoire .cv{color:#43286b;}
  .btn.lpurple{background:#c3aede; color:#3d2456;}
  .rrow{padding:3px 2px; border-bottom:1px solid rgba(122,83,32,.16); line-height:1.35;}
  .bluffsel{display:flex; gap:4px; margin-bottom:2px;}
  .bluffsel select{flex:1; min-width:0; font-size:clamp(9px,.9vw,12px); padding:3px; border:1px solid rgba(122,83,32,.5);
    border-radius:5px; background:rgba(255,252,244,.85); color:var(--ink); font-family:inherit;}
  .nstep{display:flex; gap:6px; align-items:flex-start; padding:4px 2px; border-bottom:1px solid rgba(122,83,32,.16); line-height:1.3; cursor:pointer;}
  .nstep input{margin-top:3px;} .nstep .nn{color:#6a4e8f; font-size:.92em;}
  .impkill{margin:2px 0 5px 24px; font-size:clamp(9px,.95vw,13px); color:#43286b; display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .impkill select{font-size:clamp(9px,.9vw,12px); padding:2px 5px; border:1px solid rgba(74,43,107,.5); border-radius:5px; background:rgba(255,252,244,.9); color:#3a2a12; font-family:inherit;}
  .impkill.warn{color:#b0402e; font-weight:700;}
  .impkill.done{color:#2e7d43; font-weight:700;}
  .regbtn{display:inline-block; margin-left:5px; padding:1px 9px; border-radius:10px; cursor:pointer; font-size:.92em;
    border:1px solid rgba(74,43,107,.4); color:#43286b; background:rgba(240,235,250,.6);}
  .regbtn.on{background:#b9a0d6; color:#2e1a47; font-weight:800;}
  .nomcard{border:1px solid rgba(74,43,107,.28); border-radius:8px; padding:5px 7px; margin-bottom:6px;}
  .nomhead{display:flex; justify-content:space-between; align-items:center; font-weight:700; color:#43286b; font-size:clamp(10px,1vw,13px);}
  .voterow{display:flex; flex-wrap:wrap; gap:3px; margin-top:4px;}
  .voter{min-width:20px; text-align:center; padding:1px 5px; border-radius:8px; cursor:pointer; font-size:.85em;
    border:1px solid rgba(74,43,107,.35); color:#43286b; background:rgba(240,235,250,.5);}
  .voter.on{background:#7a1f8f; color:#fff; border-color:#7a1f8f;}
  .voter.ghost{border-style:dashed;}
  .voter.disabled{opacity:.3; cursor:not-allowed; text-decoration:line-through;}
  .onblock{color:#b0402e; font-weight:800;}
  .listmode{display:flex; gap:6px; margin-bottom:5px;}
  .listmode .regbtn{margin-left:0;}
  .rchip.locked{opacity:.5; text-decoration:line-through; background:rgba(120,110,130,.28)!important; border-style:dashed!important;}
  .ninfo{margin-top:3px; padding:3px 7px; border-radius:6px; background:rgba(74,43,107,.12);
    border-left:3px solid #7a5aa0; font-size:.92em; color:#3a2456; line-height:1.35;}
  .ninfo b{color:#2e1a47; font-size:1.15em;}
  .ninfo-warn{display:inline-block; background:#b0402e; color:#fff; border-radius:4px; padding:0 5px; margin-right:4px; font-weight:700;}
  /* per-seat info bubbles (grimoire) */
  #bubbleLayer{position:absolute; inset:0; z-index:40; pointer-events:none;}
  .bubble{position:absolute; transform:translateY(-50%); pointer-events:auto; z-index:41;
    width:180px; border-radius:12px; padding:8px 10px; color:#fff6df;
    border:1.5px solid rgba(184,134,11,.65);
    background:radial-gradient(circle at 50% 30%, rgba(60,40,70,.86), rgba(30,20,40,.92));
    box-shadow:0 5px 16px rgba(0,0,0,.5); font-size:clamp(11px,1.08vw,15px);}
  .bubble .bub-h{font-weight:700; margin-bottom:5px; font-size:.86em; color:#e9c46a; display:flex; justify-content:space-between; align-items:center;}
  .bubble .bub-x{cursor:pointer; color:#e9c46a; font-weight:700; padding:0 3px;}
  .bubble .bub-x:hover{color:#fff;}
  .bubble textarea{width:100%; min-height:58px; resize:vertical; border:1px solid rgba(184,134,11,.35); border-radius:7px; padding:6px;
    background:rgba(18,10,28,.5); color:#fff6df; font-family:inherit; font-size:1em; box-sizing:border-box;}
  .bubble textarea::placeholder{color:rgba(255,246,223,.45);}
  .bubble::after{content:""; position:absolute; border:9px solid transparent;}
  .bubble.br::after{left:-17px; top:50%; transform:translateY(-50%); border-right-color:rgba(40,26,52,.9);}
  .bubble.bl::after{right:-17px; top:50%; transform:translateY(-50%); border-left-color:rgba(40,26,52,.9);}
  .bubble.bb::after{top:-17px; left:50%; transform:translateX(-50%); border-bottom-color:rgba(40,26,52,.9);}
  .bubble.bt::after{bottom:-17px; left:50%; transform:translateX(-50%); border-top-color:rgba(40,26,52,.9);}
  /* hover auto-info box (centered on seat) */
  #hoverBox{position:absolute; transform:translate(-50%,-50%); pointer-events:none; z-index:45; display:none;
    padding:7px 11px; border-radius:12px; text-align:center; color:#fff6df;
    border:2px solid rgba(184,134,11,.8);
    background:radial-gradient(circle at 50% 30%, rgba(60,40,70,.9), rgba(28,18,42,.94));
    box-shadow:0 4px 15px rgba(0,0,0,.6); font-size:clamp(10px,1vw,13px); line-height:1.4;}
  #hoverBox.on{display:block;}
  #winBanner{position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:60; display:none;
    padding:8px 24px; border-radius:0 0 14px 14px; font-weight:800; font-size:clamp(13px,1.7vw,23px);
    box-shadow:0 5px 18px rgba(0,0,0,.55); letter-spacing:1px; text-align:center; white-space:nowrap;}
  #winBanner.good{background:linear-gradient(#3a7d4a,#2c6640); color:#eafff0; border:2px solid #61c281; border-top:none;}
  #winBanner.evil{background:linear-gradient(#8a2f26,#661d18); color:#ffe8e4; border:2px solid #cf4436; border-top:none;}
  #winBanner.on{display:block;}
  #winIcon{position:absolute; transform:translate(-50%,-50%); z-index:55; display:none; pointer-events:none;
    filter:drop-shadow(0 6px 22px rgba(0,0,0,.6));}
  #winIcon img{width:100%; display:block;}
  #hoverBox .hb-role{font-weight:800; color:#e9c46a; margin-bottom:3px;}
  #hoverBox .hb-info b{color:#ffe08a;}
  #hoverBox .hb-line{text-align:left; margin-top:4px; line-height:1.4;}
  #hoverBox .hb-line b{color:#ffe08a;}
  #hoverBox .hb-n{display:inline-block; color:#1c1226; background:#e9c46a; border-radius:4px; padding:0 5px; margin-right:5px; font-weight:800; font-size:.88em;}
  #hoverBox .hb-ab{text-align:left; opacity:.9; font-size:.95em; line-height:1.4;}
  #hoverBox .hb-sep{height:1px; background:rgba(184,134,11,.55); margin:7px 0 3px;}
  /* night stepper */
  .night-ctl{display:flex; align-items:center; justify-content:center; gap:10px; flex:0 0 auto; margin:1px 0 3px;
    color:#43286b; font-weight:800; font-size:clamp(11px,1.1vw,15px);}
  .night-ctl button{width:26px; height:26px; border:1px solid rgba(74,43,107,.4); background:rgba(240,235,250,.6);
    color:#43286b; border-radius:6px; cursor:pointer; font-weight:700; line-height:1;}
  .night-ctl button:hover{background:#b9a0d6;}
  .night-ctl b{color:#7a1f8f; font-size:1.2em;}
  /* 魔典底栏：夜数(第一页)放大，发牌/重置按钮变窄 */
  .grimoire .bottom-bar .night-ctl{flex:1; gap:12px; font-size:clamp(13px,1.45vw,20px);}
  .grimoire .bottom-bar .night-ctl button{width:clamp(30px,3vw,40px); height:clamp(30px,3vw,40px); font-size:clamp(15px,1.6vw,22px);}
  .grimoire .bottom-bar .night-ctl b{font-size:1.3em;}
  .grimoire .bottom-bar .btn{flex:0 0 auto; padding:7px 9px; font-size:clamp(9px,.9vw,12px);}
  .ledger .bottom-bar{margin-bottom:2.5px;}
  /* 酒馆底栏：人数放大，随机排座/清空座位变窄 */
  .ledger .bottom-bar .count{flex:1; justify-content:center; gap:12px; font-size:clamp(13px,1.45vw,20px); color:#6b4a1e; font-weight:800;}
  .ledger .bottom-bar .count button{width:clamp(30px,3vw,40px); height:clamp(30px,3vw,40px); font-size:clamp(15px,1.6vw,22px);}
  .ledger .bottom-bar .count b{color:#8a5f28; font-size:1.3em;}
  .ledger .bottom-bar .btn{flex:0 0 auto; padding:7px 9px; font-size:clamp(9px,.9vw,12px);}
  /* 背景墨水瓶热区：点击导出玩家笔记；悬停时墨口飘出光点（酒馆=金，魔典=紫） */
  .inkhotspot{position:absolute; left:39.4%; top:70.5%; width:8.6%; height:18%; cursor:pointer; z-index:6;}
  .stage:not(.grim) .inkhotspot{--glow:233,196,106;}   /* 金色（酒馆） */
  .stage.grim .inkhotspot{--glow:168,120,240;}          /* 紫色（魔典） */
  .inkhotspot .spark{position:absolute; left:50%; top:58%; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #fff 0%, rgba(var(--glow),1) 26%, rgba(var(--glow),.9) 60%, rgba(var(--glow),.3) 100%);
    box-shadow:0 0 16px 5px rgba(var(--glow),.75), 0 0 7px 2px rgba(var(--glow),.6); opacity:0; pointer-events:none;}
  .inkhotspot .spark::before{content:""; position:absolute; left:50%; top:50%; width:22%; height:22%; transform:translate(-50%,-50%);
    border-radius:50%; background:#fff; filter:blur(1px); opacity:.9;}
  .inkhotspot:hover .spark{animation:inkfloat var(--dur,3s) ease-out infinite; animation-delay:var(--dl,0s);}
  @keyframes inkfloat{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.3);}
    16%{opacity:.95;}
    60%{transform:translate(calc(-50% + var(--dx,30px)*.6 + 5px), calc(-50% - var(--dy,90px)*.6)) scale(1);}
    100%{opacity:0; transform:translate(calc(-50% + var(--dx,30px)), calc(-50% - var(--dy,90px))) scale(1.15);}
  }
  /* role roster (draggable) */
  .rlist{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:4px;}
  .rchip{padding:3px 9px; border-radius:14px; font-size:clamp(10px,1.02vw,14px); font-weight:700;
    border:1.5px solid; background:rgba(255,252,244,.85); cursor:grab; user-select:none; white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .rchip:hover{filter:brightness(.95); transform:translateY(-1px);}
  .rchip.used{opacity:.38;}
  .dstep{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; margin:0 3px; border-radius:5px; border:1px solid rgba(122,83,32,.5); background:rgba(255,252,244,.7); color:#6b4a1e; cursor:pointer; font-weight:800; user-select:none; vertical-align:middle; font-size:13px;}
  .dstep:hover{background:#e9c46a; color:#3a2a12;}

  /* ======= RIGHT: seats ======= */
  .table-zone{position:absolute; left:40%; top:8%; width:57%; height:86%;}
  .seat{position:absolute; margin:0; transform:translate(-50%,-50%); border-radius:50%;
    border:2px solid rgba(184,134,11,.75);
    background:radial-gradient(circle at 50% 35%, rgba(60,40,70,.82), rgba(30,20,40,.9));
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; text-align:center; padding:2px;
    transition:transform .12s, box-shadow .12s, border-color .12s, opacity .12s; box-shadow:0 3px 8px rgba(0,0,0,.45);}
  .seat .num{position:absolute; top:-8%; left:-8%; z-index:2; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(28,18,42,.92); color:#ffd76b; font-weight:800; line-height:1;
    border:1.5px solid rgba(233,196,106,.9); box-shadow:0 1px 4px rgba(0,0,0,.55);}
  .seat .nm{line-height:1.1; color:#fff6df; font-weight:700; word-break:break-all; max-width:88%; text-shadow:0 1px 2px rgba(0,0,0,.65);}
  .seat .deathcause{line-height:1.05; margin-top:1px; color:#ff9a8a; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.7);}
  .seat.hascause{opacity:1!important; filter:none!important;}
  .seat .stbtn img{width:100%; height:100%; object-fit:contain; opacity:.4; pointer-events:none;}
  .seat .stbtn.on img{opacity:1;}
  .seat .shieldbadge{position:absolute; z-index:3; pointer-events:none; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));}
  .seat .shieldbadge img{width:100%; height:100%; object-fit:contain;}
  .seat .role{line-height:1.05; font-weight:800; margin-top:1px; text-shadow:0 1px 2px rgba(0,0,0,.6); white-space:nowrap;}
  .seat .st{position:absolute; bottom:-7%; right:-7%; display:flex; gap:2px; z-index:2;}
  .seat .st span{background:#1a1220; border:1px solid rgba(233,196,106,.6); border-radius:7px; font-size:10px; padding:0 3px; color:#e9c46a;}
  /* grimoire status buttons (top-right of seat) */
  .seat .stbtns{position:absolute; top:-7%; right:-7%; display:flex; flex-direction:column; gap:2px; z-index:3;}
  .seat .stbtn{position:absolute; z-index:3; display:flex; align-items:center; justify-content:center; cursor:pointer;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));}
  .seat .stbtn:hover{filter:brightness(1.2) drop-shadow(0 1px 2px rgba(0,0,0,.55));}
  .seat .stbtn.on{filter:drop-shadow(0 0 3px rgba(255,220,120,.7));}
  .seat .stbtn.dead.on{filter:drop-shadow(0 0 4px rgba(255,70,55,.95));}
  .seat .stbtn.poison.on{filter:drop-shadow(0 0 4px rgba(90,235,100,.95));}
  .seat .stbtn.drunk.on{filter:drop-shadow(0 0 4px rgba(255,205,60,.95));}
  .seat.filled{border-color:#e9c46a; background:radial-gradient(circle at 50% 35%, rgba(90,60,110,.9), rgba(45,28,60,.95));}
  .seat.good{border-color:#4a86c8;} .seat.evil{border-color:#cf4436;}
  .seat.over{border-color:#ffd76b; transform:translate(-50%,-50%) scale(1.09); box-shadow:0 0 0 3px rgba(255,215,107,.5),0 4px 12px rgba(0,0,0,.5);}
  .seat.nb{border-color:#ffd76b; box-shadow:0 0 0 4px rgba(246,214,120,.55),0 3px 8px rgba(0,0,0,.45);}
  .seat:hover{border-color:#ffd76b; box-shadow:0 0 0 4px rgba(246,214,120,.6),0 4px 12px rgba(0,0,0,.5); z-index:5;}
  .seat.dead{opacity:.4; filter:grayscale(.7);}
  .seat .skull{position:absolute; top:-6px; right:-6px; width:clamp(16px,1.7vw,22px); height:clamp(16px,1.7vw,22px);
    border-radius:50%; background:#2a1a10; border:1px solid var(--gold); color:#e9c46a; font-size:clamp(9px,1vw,13px); line-height:1;
    display:none; align-items:center; justify-content:center; cursor:pointer;}
  .stage:not(.grim) .seat.filled .skull{display:flex;}
  .seat .skull:hover{background:#b0402e; color:#fff;} .seat.dead .skull{background:#b0402e; color:#fff; opacity:1;}

  /* editor modal */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50;}
  .mask.on{display:flex;}
  .modal{background:#221a30; border:1px solid #3a2d4e; border-radius:12px; padding:16px; width:340px; max-width:92vw; color:#efe6d2;}
  .modal h3{margin:0 0 10px; color:#e9c46a; font-size:16px;}
  .modal label{display:block; font-size:12px; color:#bdb0d0; margin:8px 0 3px;}
  .modal input[type=text],.modal select,.modal textarea{width:100%; padding:7px; border:1px solid #3a2d4e; border-radius:6px;
    background:#2c2340; color:#efe6d2; font-size:14px; font-family:inherit;}
  .modal .toggles{display:flex; gap:12px; margin-top:10px; flex-wrap:wrap;}
  .modal .toggles label{display:inline-flex; align-items:center; gap:5px; margin:0; font-size:13px; color:#efe6d2; cursor:pointer;}
  .modal .foot{display:flex; justify-content:space-between; margin-top:14px; gap:8px;}
  .modal .foot .btn{flex:0 0 auto; padding:7px 14px;}
  .align-badge{display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; margin-left:6px;}
  .align-badge.good{background:rgba(79,127,214,.25); color:#8db4f0;}
  .align-badge.evil{background:rgba(207,68,54,.28); color:#ef8f84;}
  /* 游戏内确认框 */
  .cfmask{position:fixed; inset:0; background:rgba(10,6,16,.62); display:none; align-items:center; justify-content:center; z-index:90;}
  .cfmask.on{display:flex;}
  .cfbox{width:min(86vw,360px); background:linear-gradient(180deg,#2b2038,#20172a); border:2px solid #e9c46a; border-radius:14px;
    padding:20px 22px 18px; color:#efe6d2; text-align:center; box-shadow:0 14px 44px rgba(0,0,0,.6), inset 0 0 34px rgba(233,196,106,.07);
    animation:cfin .18s ease;}
  @keyframes cfin{from{transform:translateY(14px) scale(.96); opacity:.2} to{transform:none; opacity:1}}
  .cf-title{font-size:16px; font-weight:800; color:#e9c46a; letter-spacing:2px; margin-bottom:10px;}
  .cf-title::before,.cf-title::after{content:"❖"; color:rgba(233,196,106,.55); margin:0 8px; font-size:12px;}
  .cf-msg{font-size:14px; line-height:1.65; color:#d8cee8; margin-bottom:16px; white-space:pre-wrap;}
  .cf-input{width:100%; padding:9px 10px; margin-bottom:16px; border:1px solid #4a3a63; border-radius:8px; background:#191122; color:#efe6d2; font-size:14px; font-family:inherit; text-align:center;}
  .cf-btns{display:flex; gap:10px; justify-content:center;}
  .cf-btns button{min-width:104px; padding:9px 14px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; border:1px solid transparent; font-family:inherit;}
  .cf-btns .cf-yes{background:#e9c46a; color:#1a1226;}
  .cf-btns .cf-yes:hover{background:#f2d489;}
  .cf-btns .cf-no{background:none; border-color:#4a3a63; color:#c8bcdd;}
  .cf-btns .cf-no:hover{border-color:#6a5688; color:#e6dcf5;}

  /* =================== 多人版：三模式共用酒馆布局 =================== */
  /* 访客（大厅/玩家）默认隐藏说书人工作台面板；说书人登录后 body.st-mode 恢复 */
  body:not(.st-mode) .ledger.seat-only, body:not(.st-mode) .grimoire.grim-only{display:none !important;}
  /* 左侧访客面板，位置与说书人面板一致 */
  .vpanel{position:absolute; left:8.3%; top:23.5%; width:23.4%; height:54.7%; display:none; flex-direction:column; gap:6px; color:var(--ink);}
  body.mode-hall #hallPanel{display:flex;}
  body.mode-notes #notesPanel{display:flex;}
  .vpanel .box-h{color:#6b4a1e;}
  .stage.grim .vpanel .box-h{color:#43286b;}
  /* 大厅客人名单 */
  #hallPanel .namelist{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:4px;}
  .nameitem{display:flex; align-items:center; gap:7px; padding:4px 8px; border-radius:8px; background:rgba(255,250,235,.55);
    border:1px solid rgba(122,83,32,.35); font-size:clamp(11px,1.15vw,15px); color:var(--ink);}
  .nameitem .no{min-width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:#2a1a10; color:#e9c46a; font-size:11px; font-weight:800; flex:0 0 auto;}
  .nameitem.dead{opacity:.5; text-decoration:line-through;} .nameitem .cz{margin-left:auto; font-size:.95em;}
  .stage.grim .nameitem{background:rgba(240,235,250,.5); border-color:rgba(74,43,107,.3); color:#3a2456;}
  /* 玩家书本 3 个 tab */
  .nbtabs{display:flex; gap:4px; flex:0 0 auto;}
  .nbtabs button{flex:1; padding:5px 2px; font-size:clamp(9px,.92vw,12px); font-weight:800; border-radius:6px; cursor:pointer;
    border:1px solid rgba(74,43,107,.4); background:rgba(240,235,250,.6); color:#43286b;}
  .nbtabs button.on{background:#b9a0d6; color:#2e1a47;}
  #notesPanel .nbcontent{flex:1; min-height:0; overflow:auto; padding-right:3px; font-size:clamp(10px,1vw,13px); color:#43286b;}
  #notesPanel .nbcontent::-webkit-scrollbar{width:6px;} #notesPanel .nbcontent::-webkit-scrollbar-thumb{background:rgba(74,43,107,.35); border-radius:3px;}
  .nb-sec{font-weight:800; color:#43286b; margin:8px 0 4px; letter-spacing:.5px;}
  .nbtok{display:inline-flex; align-items:center; gap:4px; font-size:clamp(10px,1vw,13px); padding:4px 9px; border-radius:14px; margin:0 4px 4px 0;
    border:1px solid rgba(74,43,107,.4); background:rgba(255,252,244,.85); color:#43286b; cursor:pointer; user-select:none;}
  .nbtok.on{background:#b9a0d6; color:#2e1a47; box-shadow:0 0 6px rgba(150,110,200,.5);}
  .nbtok.used{opacity:.4;}
  .nb-note{padding:4px 2px; border-bottom:1px solid rgba(122,83,32,.14); line-height:1.35;}
  .nb-role{padding:7px 9px; border-radius:8px; background:rgba(255,252,244,.6); border:1px solid rgba(74,43,107,.2); margin-bottom:6px;}
  .nb-role b{font-size:1.05em;}
  /* 访客座位圈上的玩家标记 */
  .seat .vmark{position:absolute; z-index:4; border-radius:50%; background:rgba(20,14,30,.92); border:1px solid rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center; pointer-events:none;}
  .seat .vrole{line-height:1.05; font-weight:800; margin-top:1px; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.6);}
  /* 旧覆盖层（弃用，保留以防样式引用） */
  #hallOverlay,#playerOverlay{display:none !important;}
  .ov-top{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:rgba(24,16,36,.92); border-bottom:1px solid #3a2d4e;}
  .ov-brand{display:flex; align-items:center; gap:8px; font-size:15px; color:#e9c46a; font-weight:700; letter-spacing:1px;}
  .ov-brand small{color:#9a8fb3; font-weight:400; font-size:11px; letter-spacing:0;}
  .ov-top .rt{display:flex; gap:8px; align-items:center;}
  .ov-btn{font-size:12px; color:#c8bcdd; background:rgba(40,28,58,.7); border:1px solid #3a2d4e; border-radius:16px; padding:5px 12px; cursor:pointer;}
  .ov-btn:hover{border-color:#6a5688; color:#efe6d2;}
  .ov-btn.gold{background:#e9c46a; color:#1a1226; border-color:#e9c46a; font-weight:700;}
  .ov-body{flex:1 1 auto; min-height:0; overflow-y:auto;}
  .ov-tabs{display:flex; gap:4px; padding:0 12px; background:rgba(24,16,36,.92); border-bottom:1px solid #3a2d4e;}
  .ov-tabs button{flex:1; background:none; border:none; color:#9a8fb3; font-size:14px; font-weight:600; padding:10px 0 11px; cursor:pointer; border-bottom:2.5px solid transparent;}
  .ov-tabs button.on{color:#e9c46a; border-bottom-color:#e9c46a;}
  .ov-main{max-width:540px; width:100%; margin:0 auto; padding:12px 14px 40px;}

  .hallhint{text-align:center; font-size:12.5px; color:#8a7ea6; margin:8px 0;}
  .hallhint b{color:#e9c46a;}
  #hallCircle,#pnCircle{position:relative; width:100%; max-width:440px; margin:14px auto 6px;}
  .ovseat{position:absolute; transform:translate(-50%,-50%); border-radius:50%;
    border:2px solid rgba(184,134,11,.75); background:radial-gradient(circle at 50% 35%, rgba(60,40,70,.82), rgba(30,20,40,.9));
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; padding:2px;
    box-shadow:0 3px 8px rgba(0,0,0,.45);}
  .ovseat .n{position:absolute; top:-8%; left:-8%; z-index:2; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(28,18,42,.92); color:#ffd76b; font-weight:800; line-height:1;
    border:1.5px solid rgba(233,196,106,.9);}
  .ovseat .nm{color:#fff6df; font-weight:700; line-height:1.1; max-width:88%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ovseat .rl{font-weight:800; line-height:1.05; margin-top:1px; max-width:94%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ovseat.dead{filter:grayscale(1); opacity:.62;}
  .ovseat .cause{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:.6; pointer-events:none;}
  .ovbadge{position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:3;
    background:rgba(20,14,30,.9); border:1px solid rgba(255,255,255,.28);}

  .pnlog{background:#1d1529; border:1px solid #322544; border-radius:12px; padding:10px 12px; margin-top:12px;}
  .pnlog h4{margin:0 0 8px; font-size:12px; color:#9a8fb3; font-weight:600; letter-spacing:.5px;}
  .pnlog .row{font-size:13px; padding:7px 0; border-top:1px solid #2c2340; line-height:1.5;}
  .pnlog .row:first-of-type{border-top:none;}
  .pnlog .arr{color:#8a7ea6; font-size:12px;} .pnlog .who{font-weight:600;}
  .pnlog .exec{color:#f0a89e; font-weight:700; margin-left:4px;}
  .pnlog .empty{font-size:12.5px; color:#8a7ea6;}

  .pntray{background:#1d1529; border:1px solid #322544; border-radius:12px; padding:9px 10px; margin-top:10px;}
  .pntray h4{margin:0 0 8px; font-size:12px; color:#9a8fb3; font-weight:600;}
  .pntokrow{display:flex; flex-wrap:wrap; gap:7px;}
  .pntok{display:flex; align-items:center; gap:5px; font-size:12.5px; padding:6px 10px; border-radius:16px; border:1px solid #3a2d4e; background:#241a34; color:#d8cee8; cursor:pointer; user-select:none;}
  .pntok.on{border-color:#e9c46a; background:#3a2d4e; color:#f2dfa6; box-shadow:0 0 8px rgba(233,196,106,.35);}
  .pntok.used{opacity:.42;}

  /* 登录门 */
  .gate{position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center; padding:24px;
    background:rgba(10,6,16,.72); backdrop-filter:blur(3px);}
  .gate.on{display:flex;}
  .gatebox{width:min(92vw,360px); background:linear-gradient(180deg,#2b2038,#20172a); border:2px solid #e9c46a; border-radius:16px;
    padding:24px 22px 20px; text-align:center; box-shadow:0 14px 44px rgba(0,0,0,.6), inset 0 0 34px rgba(233,196,106,.07);}
  .gatebox .ink{width:96px; height:96px; margin-bottom:6px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));}
  .gatebox h2{margin:6px 0 4px; font-size:20px; color:#e9c46a; letter-spacing:2px;}
  .gatebox .sub{font-size:12.5px; color:#b3a6c8; line-height:1.6; margin-bottom:16px;}
  .gatebox input{width:100%; padding:11px 12px; margin-bottom:10px; border:1px solid #4a3a63; border-radius:9px;
    background:#191122; color:#efe6d2; font-size:15px; font-family:inherit; text-align:center;}
  .gatebox input:focus{outline:none; border-color:#e9c46a;}
  .gatebox .go{width:100%; padding:12px; border:none; border-radius:24px; background:#e9c46a; color:#1a1226; font-weight:700; font-size:15px; cursor:pointer; margin-top:4px;}
  .gatebox .go:hover{background:#f2d489;}
  .gatebox .cancel{display:block; margin:12px auto 0; color:#9a8fb3; background:none; border:none; font-size:12.5px; cursor:pointer;}
  .gatebox .err{color:#f0a89e; font-size:12.5px; min-height:16px; margin:2px 0 8px;}
  #fbToast{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200; background:#e9c46a; color:#1a1226;
    padding:9px 16px; border-radius:20px; font-size:13px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.4); display:none;}
  #fbToast.on{display:block;}
  #stBadge{position:fixed; top:12px; right:14px; z-index:60; font-size:11.5px; color:#e9c46a; background:rgba(24,16,36,.85);
    border:1px solid rgba(233,196,106,.5); border-radius:14px; padding:4px 11px; display:none; align-items:center; gap:8px;}
  #stBadge.on{display:inline-flex;} #stBadge button{background:none; border:none; color:#c8bcdd; cursor:pointer; font-size:12px; padding:0;}
  #playerBadge{position:fixed; top:12px; right:14px; z-index:60; font-size:11.5px; color:#e9c46a; background:rgba(24,16,36,.85);
    border:1px solid rgba(233,196,106,.5); border-radius:14px; padding:4px 11px; display:none; align-items:center; gap:8px;}
  body.mode-notes #playerBadge{display:inline-flex;}
  #playerBadge button{background:rgba(233,196,106,.15); border:1px solid rgba(233,196,106,.4); border-radius:10px; color:#e9c46a; cursor:pointer; font-size:11px; padding:2px 8px;}
  #playerBadge button:hover{background:rgba(233,196,106,.3);}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="darklayer"></div>
    <button class="view-toggle" id="viewToggle" onclick="onBookClick()" title="进入说书人魔典">📖</button>
    <button class="fsbtn" id="fsBtn" onclick="toggleFull()" title="网页全屏">⛶</button>
    <div class="banner-title" id="bannerTitle">暗流涌动</div>
    <div class="inkhotspot" onclick="openPlayerGate()">
      <span class="spark" style="--dx:40px;--dy:150px;--dur:5.5s;--dl:0s"></span>
      <span class="spark" style="--dx:72px;--dy:190px;--dur:6.8s;--dl:1.2s"></span>
      <span class="spark" style="--dx:24px;--dy:132px;--dur:5.0s;--dl:2.6s"></span>
      <span class="spark" style="--dx:88px;--dy:214px;--dur:7.6s;--dl:3.8s"></span>
      <span class="spark" style="--dx:54px;--dy:172px;--dur:6.0s;--dl:1.8s"></span>
      <span class="spark" style="--dx:92px;--dy:142px;--dur:6.4s;--dl:4.6s"></span>
      <span class="spark" style="--dx:32px;--dy:202px;--dur:7.0s;--dl:.6s"></span>
    </div>

    <!-- LEFT · seat view -->
    <div class="ledger seat-only">
      <div class="box add-box">
        <div class="add">
          <input id="nameInput" placeholder="添加新客人…" maxlength="12" onkeydown="if(event.key==='Enter')addGuest()">
          <button onclick="addGuest()">入席</button>
        </div>
      </div>
      <div class="box grow"><div class="box-h">当前客人名册</div><div id="pool" class="list"></div></div>
      <div class="box grow"><div class="box-h">过往客人名册</div><div id="past" class="list"></div></div>
      <div class="box bottom-bar">
        <div class="count">
          <button onclick="setCount(-1)">−</button><span>共 <b id="countVal">8</b> 人</span><button onclick="setCount(1)">＋</button></div>
        <button class="btn gold" onclick="shuffle()">随机排座</button>
        <button class="btn ghost" onclick="clearSeats()">清空座位</button>
      </div>
    </div>

    <!-- LEFT · grimoire view -->
    <div class="grimoire grim-only">
      <div class="gtabs">
        <button id="gt-list" onclick="setGtab('list')">角色名单</button>
        <button id="gt-roles" class="on" onclick="setGtab('roles')">在场角色</button>
        <button id="gt-night" onclick="setGtab('night')">夜晚</button>
        <button id="gt-day" onclick="setGtab('day')">白天</button>
        <button id="gt-log" onclick="setGtab('log')">日志</button>
      </div>
      <div class="gcontent" id="gcontent"></div>
      <div class="box bottom-bar">
        <div class="night-ctl">
          <button onclick="stepNight(-1)" title="上一夜">◀</button>
          <span>第 <b id="nightVal">1</b> 夜</span>
          <button onclick="stepNight(1)" title="下一夜">▶</button>
        </div>
        <button class="btn purple" onclick="dealRoles()">随机发牌</button>
        <button class="btn lpurple" onclick="resetRoles()">重置角色</button>
      </div>
      <div class="box bottom-bar" style="gap:6px;">
        <button class="btn gold" onclick="stNewGame()" title="建一局新牌局并同步给玩家">🌅 开新局</button>
        <button class="btn purple" onclick="stPublish()" title="把当天提名/投票/死亡推送给所有玩家">📣 天亮公布</button>
      </div>
    </div>

    <!-- LEFT · 大厅（访客） -->

function blankMeta(){return {role:null,poison:false,drunk:false,dead:false,note:"",info:"",hist:{},isDrunk:false};}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({guests,N,tokens,uid,meta,bluffs,view,gtab,night,nightChecks,impKills,poisonPicks,monkPicks,ftPicks,butlerPicks,pingPicks,ravenPicks,undertakerPicks,sickAns,redHerring,nominations,executions,virginUsed,slayerShot,lockedRoles:[...lockedRoles],overviewDecoys,customDist})); }catch(e){} }
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)||"{}");
    if(Array.isArray(d.guests)) guests=d.guests;

    if(gtab==="first"||gtab==="other") gtab="night";   // 旧存档标签兼容

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function seatToken(i){ return tokens.find(t=>t.seat===i); }
async function exportPlayerNotes(){
  const names=[], roles=[]; let missing=0;
  for(let i=0;i<N;i++){
    const t=seatToken(i); names.push(t&&t.name?t.name:'');
    const m=meta[i]||{}; const rid = m.isDrunk?'drunk':(m.role||'');
    if(!rid) missing++; else roles.push(rid);
  }
  if(missing>0 && !await uiConfirm('还有 '+missing+' 个座位没有分配角色，仍要导出吗？（玩家速览只会包含已分配的角色）')) return;
  // 按阵营排序，打乱座位↔角色的对应，避免泄露答案
  const rank={tf:0,out:1,min:2,dem:3};
  roles.sort((a,b)=> (rank[RMAP[a].team]-rank[RMAP[b].team]) || a.localeCompare(b));
  // 本局速览集合（与魔典"本局速览"完全一致）：按阵营顺序展开
  const gs=gameOverviewSet(); const overview=[];
  ORDER.forEach(team=>{ ROLES.filter(r=>r.team===team && gs.has(r.id)).forEach(r=>overview.push(r.id)); });
  const nm = await uiPrompt('给这局起个名字（玩家会看到）：','本局',{title:'命名本局'});
  if(nm===null) return;
  const g={ name: nm||'本局', count:N, names, roles, overview, dist:(customDist||DIST[N]||[0,0,0,0]) };
  const enc = btoa(unescape(encodeURIComponent(JSON.stringify(g))));
  window.open('player-notes.html#g='+enc, '_blank');
}

/* ---------- seat-view guest ops ---------- */
function addGuest(){
  const inp=document.getElementById("nameInput"); const name=inp.value.trim(); if(!name) return;
  if(!guests.includes(name)) guests.push(name);
  if(!tokens.some(t=>t.name===name)) tokens.push({id:++uid,name,seat:null,dead:false});
  inp.value=""; inp.focus(); render();
}
function reAdd(name){ if(tokens.some(t=>t.name===name)) return; tokens.push({id:++uid,name,seat:null,dead:false}); render(); }
function removeToken(id){ tokens=tokens.filter(t=>t.id!==id); if(selected===id) selected=null; render(); }
function forgetGuest(name){ guests=guests.filter(g=>g!==name); tokens=tokens.filter(t=>t.name!==name); render(); }
function setCount(d){ N=Math.max(5,Math.min(15,N+d)); customDist=null; tokens.forEach(t=>{if(t.seat!==null&&t.seat>=N)t.seat=null;}); ensureMeta(); render(); }
async function shuffle(){ if(!await uiConfirm("确定随机排座？将打乱当前所有座位安排。")) return; const order=tokens.slice();
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  tokens.forEach(t=>t.seat=null); order.forEach((t,i)=>{if(i<N)t.seat=i;}); render(); }
async function clearSeats(){ if(!await uiConfirm("确定清空所有座位？")) return; tokens.forEach(t=>t.seat=null); render(); }
function moveToken(id,seat){ const tok=tokens.find(t=>t.id===id); if(!tok)return;
  if(seat!==null){ const occ=tokens.find(t=>t.seat===seat); if(occ&&occ.id!==id) occ.seat=tok.seat; } tok.seat=seat; }
function dropOn(seat,e){ const id=+e.dataTransfer.getData("text"); moveToken(id,seat); selected=null; render(); }
function seatClick(i){ if(selected!==null){ moveToken(selected,i); selected=null; render(); return; } const t=seatToken(i); if(t){ selected=t.id; render(); } }
function toggleDead(i){ const wasDead=isDeadSeat(i);
  const t=seatToken(i); if(t){ t.dead=!t.dead; } else { ensureMeta(); meta[i].dead=!meta[i].dead; }
  const nowDead=isDeadSeat(i);
  if(nowDead&&!wasDead) demonDied(i); else if(!nowDead&&wasDead) demonRevived(i);
  render(); }
function togglePoison(i){ ensureMeta(); meta[i].poison=!meta[i].poison; render(); }
function toggleDrunk(i){ ensureMeta(); meta[i].drunk=!meta[i].drunk; render(); }

/* ---------- grimoire ops ---------- */
async function dealRoles(){
  const base=customDist||DIST[N]; if(!base) return;
  if(base.reduce((a,b)=>a+b,0)!==N){ await uiAlert('各阵营数量合计与人数（'+N+'）不符，请调整后再发牌。'); return; }
  if(!await uiConfirm("确定随机发牌？将重新分配所有身份。")) return;
  ensureMeta(); impKills={}; poisonPicks={}; monkPicks={}; ftPicks={}; butlerPicks={}; pingPicks={}; ravenPicks={}; undertakerPicks={}; sickAns={}; nominations={}; executions={}; virginUsed=false; slayerShot=null; redHerring=-1;
  Object.keys(nightChecks).forEach(k=>delete nightChecks[k]);   // 清空每夜勾选
  const pick=(team,k)=>{ const pool=ROLES.filter(r=>r.team===team&&!lockedRoles.has(r.id)).map(r=>r.id);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    return pool.slice(0,Math.max(0,k)); };
  // 先定爪牙/恶魔，再按设置期能力（男爵）调整好人构成
  const mins=pick("min",base[2]), dems=pick("dem",base[3]);
  let tfN=base[0], outN=base[1];
  if(mins.includes("baron")){ const s=Math.min(2,tfN); tfN-=s; outN+=s; }   // 男爵：外来者+2、镇民−2（最多2+2=4，正好等于外来者总数）
  let chosen=[...pick("tf",tfN),...pick("out",outN),...mins,...dems];
  for(let i=chosen.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[chosen[i],chosen[j]]=[chosen[j],chosen[i]];}
  meta.forEach((m,i)=>{ m.role=chosen[i]||null; m.poison=false; m.drunk=false; m.hist={}; m.info=""; m._swSeat=null; m._swPrevRole=null; m.isDrunk=false; });
  tokens.forEach(t=>t.dead=false);
  // 酒鬼：把「酒鬼」这张牌换成「自以为是的某镇民」，并打上永久受损标记
  const dSeat=meta.findIndex(m=>m.role==="drunk");
  if(dSeat>=0){ const used=new Set(meta.map(m=>m.role).filter(Boolean));
    const pool=ROLES.filter(r=>r.team==="tf"&&!used.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
    meta[dSeat].role = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null; meta[dSeat].isDrunk=true; meta[dSeat].drunk=true; }
  // 给恶魔随机 3 个伪装（不在场的好人角色）；酒鬼的真身是"酒鬼"，其自以为的镇民并不在场，可作伪装
  const inSet=new Set(meta.map(m=> m && (m.isDrunk?'drunk':m.role)).filter(Boolean));
  const goodPool=ROLES.filter(r=>(r.team==="tf"||r.team==="out")&&!inSet.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
  for(let i=goodPool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[goodPool[i],goodPool[j]]=[goodPool[j],goodPool[i]];}
  bluffs=[goodPool[0]||"", goodPool[1]||"", goodPool[2]||""];
  // 本局速览混淆镇民：男爵 +2；恶魔伪装里每含 1 个外来者再 +1，避免一眼看出伪装含外来者
  overviewDecoys=[]; refreshOverviewDecoys();
  // 红鲱鱼：随机一名好人（非恶魔、非占卜师本人），会被占卜师读为恶魔
  if(chosen.includes("fortuneteller")){
    const goodSeats=[]; meta.forEach((m,i)=>{ if(m.role && !isEvil(RMAP[m.role].team) && m.role!=="fortuneteller") goodSeats.push(i); });
    if(goodSeats.length) redHerring=goodSeats[Math.floor(Math.random()*goodSeats.length)];
  }
  render();
}
async function resetRoles(){ if(!await uiConfirm("重置所有身份、状态、备注、伪装？（保留名字与座位）")) return;
  meta=Array.from({length:N},blankMeta); bluffs=["","",""]; impKills={}; poisonPicks={}; monkPicks={}; ftPicks={}; butlerPicks={}; pingPicks={}; ravenPicks={}; undertakerPicks={}; sickAns={}; nominations={}; executions={}; virginUsed=false; slayerShot=null; redHerring=-1;
  Object.keys(nightChecks).forEach(k=>delete nightChecks[k]); overviewDecoys=[]; tokens.forEach(t=>t.dead=false); render(); }
function setBluff(k,v){ bluffs[k]=v; refreshOverviewDecoys(); render(); }

/* ---------- 夜晚信息自动计算 ---------- */
function seatAlive(i){ const t=seatToken(i), m=meta[i]||{}; return !(t?t.dead:m.dead); }
function seatEvil(i){ const m=meta[i]; return !!(m&&m.role&&isEvil(RMAP[m.role].team)); }
/* 判定阵营（含间谍/陌客误判）：间谍可判善良、陌客可判邪恶，其余按真实阵营 */
function effReg(i){ const m=meta[i]; if(!m||!m.role) return 'good';
  if(m.reg==='good'||m.reg==='evil') return m.reg;
  if(m.role==='spy') return 'good';        // 间谍默认判善良
  if(m.role==='recluse') return 'evil';    // 陌客默认判邪恶
  return isEvil(RMAP[m.role].team)?'evil':'good'; }
function regEvil(i){ return effReg(i)==='evil'; }
function setReg(i,v){ ensureMeta(); meta[i].reg=v; render(); }
function setRedHerring(v){ redHerring = v===""? -1 : +v; render(); }
function setDrunk(v){ const prev=meta.findIndex(m=>m&&m.isDrunk); if(prev>=0){ meta[prev].isDrunk=false; meta[prev].drunk=false; }
  if(v!==""){ ensureMeta(); meta[+v].isDrunk=true; meta[+v].drunk=true; } render(); }
function teamSeats(team){ const r=[]; meta.forEach((m,i)=>{ if(m.role&&RMAP[m.role].team===team) r.push(i); }); return r; }
function nameAt(i){ const t=seatToken(i); return t?esc(t.name):('座位'+(i+1)); }
function nearestLiving(i,dir){ for(let s=1;s<N;s++){ const j=((i+dir*s)%N+N)%N; if(j===i) break; if(seatAlive(j)) return j; } return -1; }
function computeNightInfo(id){
  const seats=[]; meta.forEach((m,i)=>{ if(m.role===id) seats.push(i); }); if(!seats.length) return "";
  const i=seats[0], m=meta[i];
  if(isDeadSeat(i)) return '<span class="ninfo-warn">✝ 已出局，不再行动</span>';
  const warn=(m.poison||m.drunk)?'<span class="ninfo-warn">⚠中毒/醉酒 · 信息不可靠（可真可假，由你定）</span>':'';
  const label=(team)=>teamSeats(team).map(j=>nameAt(j)+'＝'+RMAP[meta[j].role].name);
  if(id==="chef"){ return warn+'相邻邪恶对数：<b>'+chefPairs()+'</b>'; }
  if(id==="empath"){ return warn+'两侧存活邻座邪恶数：<b>'+empathNum(i)+'</b>'; }
  if(id==="washerwoman"){ const t=label("tf"); return warn+'镇民候选：'+(t.join('、')||'无')+'（选其一+任意一名玩家）'; }
  if(id==="librarian"){ const o=label("out"); return warn+(o.length?'外来者：'+o.join('、')+'（选其一+任意一名玩家）':'无外来者 → 告知“没有外来者”'); }
  if(id==="investigator"){
    const cand=[]; meta.forEach((mm,j)=>{ if(!mm.role) return; const tm=RMAP[mm.role].team;
      if(tm==="min" && effReg(j)!=="good") cand.push(nameAt(j)+'＝'+RMAP[mm.role].name);
      else if(mm.role==="recluse" && effReg(j)==="evil") cand.push(nameAt(j)+'＝陌客(判为爪牙)'); });
    return warn+(cand.length?'爪牙候选：'+cand.join('、')+'（选其一+任意一名玩家）':'无可判定爪牙'); }
  if(id==="fortuneteller"){
    const d=[]; meta.forEach((mm,j)=>{ if(!mm.role) return;
      if(RMAP[mm.role].team==="dem") d.push(nameAt(j));
      else if(mm.role==="recluse" && effReg(j)==="evil") d.push(nameAt(j)+'(陌客可读为恶魔)'); });
    return warn+'读为恶魔：'+(d.join('、')||'无')+'　红鲱鱼另设一名好人；所选2人含其一则答“是”'; }
  if(id==="undertaker"){ const ex=executions[night-1];
    if(ex===undefined) return warn+'昨日尚未记录处决';
    if(ex<0) return warn+'昨日无人被处决 → 无信息';
    const tr=meta[ex]?(meta[ex].isDrunk?'drunk':meta[ex].role):null;   // 酒鬼真身=酒鬼
    return warn+'昨日处决：'+nameAt(ex)+' → '+(tr&&RMAP[tr]?RMAP[tr].name:'（未分配）'); }
  if(id==="spy"){ return warn+'查看魔典（知晓全部身份与状态）　注意：间谍可被判定为好人 / 镇民 / 外来者'; }
  return warn;
}
/* 夜间信息录入：勾选夜间顺序的某一步 → 记录该角色本夜信息；取消勾选 → 删除该条 */
/* 每晚记录按来源标签分条存储：hist[night]={evil,info,kill,death,role}，兼容旧的字符串格式 */
function histSet(seat,tag,text){
  if(seat<0||!meta[seat]) return;
  if(!meta[seat].hist) meta[seat].hist={};
  const h=meta[seat].hist;
  if(typeof h[night]==="string") h[night]={info:h[night]};   // 旧数据兼容
  if(!h[night]) h[night]={};
  if(text==null||text==="") delete h[night][tag]; else h[night][tag]=text;
  if(Object.keys(h[night]).length===0) delete h[night];
}
const PICKERS=new Set(["fortuneteller","washerwoman","librarian","investigator","ravenkeeper","undertaker","chef","empath"]);
function recordStep(roleId,on){
  const idx=meta.findIndex(m=>m&&m.role===roleId); if(idx<0) return;
  if(PICKERS.has(roleId)) return;   // 这些角色由各自的选择器记录实际结果
  histSet(idx,'info', on?computeNightInfo(roleId):null);
}
function recordSpecial(sid,on){
  const mins=teamSeats("min"), dem=teamSeats("dem");
  if(sid==="_minion"){
    const txt='爪牙互认：'+(mins.map(nameAt).join('、')||'无')+'　恶魔：'+(dem.map(nameAt).join('、')||'无');
    mins.forEach(i=>histSet(i,'evil', on?txt:null));
  } else if(sid==="_demon"){
    const bl=bluffs.filter(Boolean).map(id=>RMAP[id]?RMAP[id].name:'').filter(Boolean);
    const txt='爪牙：'+(mins.map(nameAt).join('、')||'无')+'　伪装：'+(bl.join('、')||'（未设）');
    dem.forEach(i=>histSet(i,'evil', on?txt:null));
  }
}
function stepNight(d){ night=Math.max(1,night+d); render(); }

/* ---------- 小恶魔夜间击杀 / 自杀转移 ---------- */
function isDeadSeat(i){ const t=seatToken(i); return t?!!t.dead:!!(meta[i]&&meta[i].dead); }
function killSeat(i,dead){ const t=seatToken(i); if(t) t.dead=dead; else { ensureMeta(); meta[i].dead=dead; } }
function livingSeats(){ const r=[]; for(let i=0;i<N;i++) if(!isDeadSeat(i)) r.push(i); return r; }
function allSeats(){ const r=[]; for(let i=0;i<N;i++) r.push(i); return r; }   // 含已出局，用于可选全体的能力/提名/投票
function countAlive(){ return livingSeats().length; }
function impSeat(){ let dead=-1; for(let i=0;i<N;i++){ if(meta[i]&&meta[i].role==="imp"){ if(!isDeadSeat(i)) return i; dead=i; } } return dead; }

/* ---------- 投毒者夜间下毒 ---------- */
function poisonerSeat(){ return meta.findIndex(m=>m&&m.role==="poisoner"); }
function poisonPick(v){
  const pz=poisonerSeat();
  Object.keys(poisonPicks).forEach(k=>{ const s=poisonPicks[k]; if(meta[s]) meta[s].poison=false; }); // 旧毒在下次行动前失效（历史保留）
  const prev=poisonPicks[night];
  if(prev!=null){ histSet(pz,'poison',null); histSet(prev,'poisoned',null); }   // 撤销本夜记录
  if(v===""){ delete poisonPicks[night]; reResolveKill(); render(); return; }
  const t=+v;
  poisonPicks[night]=t; meta[t].poison=true;
  histSet(pz,'poison','下毒 '+nameAt(t));
  histSet(t,'poisoned','被投毒者下毒（当晚及次日中毒，信息可能为假）');
  reResolveKill(); render();
}
/* ---------- 僧侣守护 / 士兵免疫（影响恶魔击杀） ---------- */
function healthy(i){ return i>=0 && meta[i] && !meta[i].poison && !meta[i].drunk && !meta[i].isDrunk; }
function deathCauseLabel(i){
  const h=meta[i]&&meta[i].hist; if(!h) return "";
  let txt=""; Object.keys(h).forEach(n=>{ if(h[n]&&h[n].death) txt=h[n].death; });
  if(!txt) return "";
  if(txt.indexOf('处决')>=0) return '处决';
  if(txt.indexOf('猎人')>=0) return '被射杀';
  if(txt.indexOf('小恶魔')>=0 || txt.indexOf('代 ')>=0 || txt.indexOf('自杀')>=0) return '夜晚死亡';
  return '出局';
}
function deathCauseIcon(i){ const dc=deathCauseLabel(i);
  if(dc==='处决') return 'assets/s-execution.png';     // 激进抠图（绞索圈）
  if(dc==='被射杀') return 'assets/mk-slayer.png';
  if(dc==='夜晚死亡') return 'assets/g3-demonkill.png';
  return 'assets/bg-dead.png'; }   // 手动/未知死因 → 淡化骷髅
function isProtected(target){
  const monk=meta.findIndex(m=>m&&m.role==="monk");
  if(monk>=0 && !isDeadSeat(monk) && healthy(monk) && monkPicks[night]===target) return true;   // 僧侣守护
  if(meta[target] && meta[target].role==="soldier" && healthy(target)) return true;              // 士兵免疫
  return false;
}
function reResolveKill(){
  const rec=impKills[night]; if(!rec||rec.type!=="normal") return;
  const t=rec.target, blocked=isProtected(t); if(blocked===rec.blocked) return;
  if(blocked){ if(rec.death>=0){ killSeat(rec.death,false); if(rec.death!==t) histSet(rec.death,'death',null); } rec.death=-1;
    histSet(rec.imp,'kill','击杀 '+nameAt(t)+'（被守护/免疫，未死）'); histSet(t,'death',null); histSet(t,'protected','被小恶魔选中但幸免（守护/免疫）'); }
  else { rec.death=t; killSeat(t,true); histSet(rec.imp,'kill','击杀 '+nameAt(t)); histSet(t,'protected',null); histSet(t,'death','被小恶魔击杀出局'); }
  rec.blocked=blocked;
}
function monkPick(v){ if(v==="") delete monkPicks[night]; else monkPicks[night]=+v; reResolveKill(); render(); }
function monkUI(){
  const mk=meta.findIndex(m=>m&&m.role==="monk"); if(mk<0) return "";
  if(isDeadSeat(mk)) return '<div class="impkill done" style="color:#8a6a2a">僧侣已出局，未行动</div>';
  const rec=monkPicks[night];
  let opts='<option value="">—</option>';
  allSeats().forEach(i=>{ if(i===mk) return; opts+='<option value="'+i+'"'+(rec===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+(isDeadSeat(i)?'（已出局）':'')+'</option>'; });
  return '<div class="impkill">守护目标：<select onchange="monkPick(this.value)">'+opts+'</select></div>';
}
/* ---------- 厨师 / 共情者：数字信息；中毒时可自定数字 ---------- */
function chefPairs(){ let p=0; for(let k=0;k<N;k++){ if(regEvil(k)&&regEvil((k+1)%N)) p++; } return p; }
function empathNum(seat){ const l=nearestLiving(seat,-1), r=nearestLiving(seat,1); let c=0; if(l>=0&&regEvil(l))c++; if(r>=0&&r!==l&&regEvil(r))c++; return c; }
function sickSet(roleId,v){ const k=night+":"+roleId; if(v==="") delete sickAns[k]; else sickAns[k]=v; render(); }
function numRole(roleId,label){ return {
  seat: meta.findIndex(m=>m&&m.role===roleId),
  trueVal: roleId==="chef"?chefPairs():empathNum(meta.findIndex(m=>m&&m.role==="empath")),
  label };
}
function recordNum(roleId,label){ const info=numRole(roleId,label); const s=info.seat; if(s<0) return;
  if(!nightChecks[night+":"+roleId]){ histSet(s,'info',null); return; }   // 未勾选该步骤则不记录
  if(healthy(s)){ histSet(s,'info',label+'：'+info.trueVal+' · 真'); return; }
  const c=sickAns[night+":"+roleId]; if(c==null){ histSet(s,'info',null); return; }
  histSet(s,'info',label+'：'+c+' · '+(+c===info.trueVal?'真':'假')); }
function numUI(roleId,label,maxV){ const info=numRole(roleId,label); const s=info.seat; if(s<0||isDeadSeat(s)||healthy(s)) return "";
  const cur=sickAns[night+":"+roleId]; let o='<option value="">数值</option>';

  let h='<div class="impkill warn">中毒·自定'+label+'：<select onchange="sickSet(\''+roleId+'\',this.value)">'+o+'</select></div>';
  if(cur!=null) h+='<div class="impkill '+(+cur===info.trueVal?'done':'warn')+'">'+label+'：'+cur+' · '+(+cur===info.trueVal?'真':'假')+'</div>';
  return h; }
/* ---------- 送葬者：得知昨日被处决者角色；中毒时可自定假身份 ---------- */
function undertakerResult(){
  const ut=meta.findIndex(m=>m&&m.role==="undertaker"); if(ut<0) return null;
  const ex=executions[night-1]; if(ex===undefined || ex<0) return null;
  const trueRole = meta[ex] ? (meta[ex].isDrunk ? 'drunk' : meta[ex].role) : null;   // 酒鬼真身=酒鬼
  const trueName = trueRole && RMAP[trueRole] ? RMAP[trueRole].name : null;
  if(healthy(ut)){ if(!trueName) return null; return {text:'昨日处决 '+nameAt(ex)+' ＝ '+trueName+' · 真', truth:true}; }
  const rec=undertakerPicks[night]; if(!rec) return null;

}
function undertakerSet(v){ if(v==="") delete undertakerPicks[night]; else undertakerPicks[night]=v; render(); }
function recordUndertaker(){ const ut=meta.findIndex(m=>m&&m.role==="undertaker"); if(ut<0) return;
  if(!nightChecks[night+":undertaker"]){ histSet(ut,'info',null); return; }   // 未勾选则不记录

function undertakerUI(){

  ROLES.filter(r=>ov.has(r.id)).forEach(r=>{ rOpt+='<option value="'+r.id+'"'+(undertakerPicks[night]===r.id?' selected':'')+'>'+r.name+'</option>'; });
  let h='<div class="impkill warn">中毒·告知的假身份（限本局速览）：<select onchange="undertakerSet(this.value)">'+rOpt+'</select></div>';
  const r=undertakerResult(); if(r) h+='<div class="impkill '+(r.truth?'done':'warn')+'">'+r.text+'</div>';
  return h;
}
/* ---------- 守鸦人：夜里死亡时选 1 人得知其角色 ---------- */
function ravenResult(){
  const rk=meta.findIndex(m=>m&&m.role==="ravenkeeper"); if(rk<0) return null;
  const rec=ravenPicks[night]||{}; if(rec.t==null) return null;

  if(healthy(rk)){ if(!actual) return null; return {text:'得知 '+nameAt(rec.t)+' ＝ '+RMAP[actual].name+' · 真', truth:true}; }
  if(!rec.role) return null; const truth=actual===rec.role;

}
function ravenSet(field,v){ if(!ravenPicks[night]) ravenPicks[night]={}; const rec=ravenPicks[night];
  if(field==="t") rec.t = v===""?null:+v; else rec.role = v===""?null:v;
  const rk=meta.findIndex(m=>m&&m.role==="ravenkeeper"); const r=ravenResult(); histSet(rk,'info', r?r.text:null); render(); }
function ravenUI(){
  const rk=meta.findIndex(m=>m&&m.role==="ravenkeeper"); if(rk<0) return "";

  let opts='<option value="">选查看对象</option>';

    h+='<div class="impkill warn">中毒·告知的假身份（限本局速览）：<select onchange="ravenSet(\'role\',this.value)">'+rOpt+'</select></div>';
  }
  const r=ravenResult(); if(r) h+='<div class="impkill '+(r.truth?'done':'warn')+'">'+r.text+'</div>';

/* ---------- 管家：选主人，次日仅当主人投票才可投 ---------- */
function butlerSeat(){ return meta.findIndex(m=>m&&m.role==="butler"); }
function butlerPick(v){ if(v==="") delete butlerPicks[night]; else butlerPicks[night]=+v; enforceButler(); render(); }
function butlerUI(){

  let opts='<option value="">—</option>';
  allSeats().forEach(i=>{ if(i===b) return; opts+='<option value="'+i+'"'+(rec===i?' selected':'')+'>'+(i+1)+' '+nameAt(i)+(isDeadSeat(i)?'（已出局）':'')+'</option>'; });

function enforceButler(){
  const b=butlerSeat(); if(b<0 || !healthy(b)) return;   // 管家中毒/醉酒时无限制
  const master=butlerPicks[night]; const noms=nominations[night]||[];
  noms.forEach(nom=>{ const bi=nom.voters.indexOf(b);
    if(bi>=0 && (master==null || !nom.voters.includes(master))) nom.voters.splice(bi,1); });   // 主人没投则移除管家票
}
/* ---------- 占卜师选 2 人 + 红鲱鱼 ---------- */
function readsDemon(i){
  if(i==null||i<0) return false; const m=meta[i]; if(!m||!m.role) return false;
  if(RMAP[m.role].team==="dem") return true;
  if(m.role==="recluse" && effReg(i)==="evil") return true;   // 陌客可读为恶魔
  if(i===redHerring) return true;                             // 红鲱鱼
  return false;
}
function ftPick(idx,v){
  let p=(ftPicks[night]||[null,null]).slice(); p[idx]= v===""?null:+v;
  if(p[0]==null && p[1]==null) delete ftPicks[night]; else ftPicks[night]=p;
  render();
}
function ftAuto(){ const cur=ftPicks[night]; if(!cur||cur[0]==null||cur[1]==null) return null; return readsDemon(cur[0])||readsDemon(cur[1]); }
function recordFt(){ const ft=meta.findIndex(m=>m&&m.role==="fortuneteller"); if(ft<0) return;
  const auto=ftAuto(), cur=ftPicks[night];
  if(auto==null){ histSet(ft,'info',null); return; }
  if(healthy(ft)){ histSet(ft,'info','占卜 '+nameAt(cur[0])+'、'+nameAt(cur[1])+' → '+(auto?'有恶魔':'无')+' · 真'); return; }
  const c=sickAns[night+":fortuneteller"]; if(!c){ histSet(ft,'info',null); return; }
  const given=c==='yes', truth=given===auto;
  histSet(ft,'info','占卜 '+nameAt(cur[0])+'、'+nameAt(cur[1])+' → '+(given?'有恶魔':'无')+' · '+(truth?'真':'假')); }
/* 本局速览混淆镇民数：男爵 +2；恶魔伪装每含 1 外来者 +1 */
function refreshOverviewDecoys(){
  let need=0;
  if(meta.some(m=>m&&m.role==="baron")) need+=2;
  need+=bluffs.filter(b=>b&&RMAP[b]&&RMAP[b].team==="out").length;
  const inPlay=new Set(meta.map(m=> m && (m.isDrunk?'drunk':m.role)).filter(Boolean));
  const bluffSet=new Set(bluffs.filter(Boolean));
  const valid=id=>RMAP[id]&&RMAP[id].team==="tf"&&!inPlay.has(id)&&!bluffSet.has(id)&&!lockedRoles.has(id);
  let keep=(overviewDecoys||[]).filter(valid).slice(0,need);
  if(keep.length<need){
    const used=new Set([...inPlay, ...bluffSet, ...keep]);
    const pool=ROLES.filter(r=>r.team==="tf"&&!used.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    keep=keep.concat(pool.slice(0,need-keep.length));
  }
  overviewDecoys=keep;
}
/* 本局速览角色集合：在场镇民 + 恶魔伪装 + 全部外来者/爪牙/恶魔 + 混淆镇民 */
function gameOverviewSet(){
  const s=new Set();
  ROLES.forEach(r=>{ if(r.team!=="tf" && !lockedRoles.has(r.id)) s.add(r.id); });
  meta.forEach(m=>{ if(m.role && RMAP[m.role].team==="tf") s.add(m.role); });
  bluffs.forEach(b=>{ if(b) s.add(b); });
  (overviewDecoys||[]).forEach(id=>s.add(id));
  return s;
}
/* ---------- 洗衣妇 / 图书管理员 / 调查员：选 2 人；健康时系统自动判定，中毒时手选并标真假 ---------- */
function pingTeam(roleId){ return roleId==="washerwoman"?"tf":roleId==="librarian"?"out":"min"; }
function pingResult(roleId){
  const seat=meta.findIndex(m=>m&&m.role===roleId); if(seat<0) return null;
  const team=pingTeam(roleId), rec=pingPicks[roleId]||{}, sick=!healthy(seat);

      s.innerHTML=html;
      s.addEventListener("click",()=>seatClick(i));
      s.addEventListener("dragover",e=>{e.preventDefault();s.classList.add("over");});
      s.addEventListener("dragleave",()=>s.classList.remove("over"));
      s.addEventListener("drop",e=>{e.preventDefault();s.classList.remove("over");dropOn(i,e);});
    } else {
      const m=meta[i]||blankMeta(); const role=m.role?RMAP[m.role]:null;
      if(role) s.classList.add(isEvil(role.team)?"evil":"good");
      const dead = t ? !!t.dead : !!m.dead;
      if(dead) s.classList.add("dead");
      html+='<div class="nm" style="font-size:'+nmF+'px">'+(t?esc(t.name):'<span style="opacity:.5">空</span>')+'</div>';
      if(role){ const label=role.name+(m.isDrunk?'-酒鬼':'');
        const rfz=Math.min(rF, Math.floor(0.8*seatD/label.length));
        html+='<div class="role" style="font-size:'+rfz+'px;color:'+(m.isDrunk?TEAMC.out:TEAMC[role.team])+'">'+label+'</div>'; }
      if(dead){ s.classList.add("hascause"); const isClaw=deathCauseLabel(i)==='夜晚死亡';
        const pos=isClaw?'calc(50% + 6px) center':'center', sz=isClaw?'80%':'62%';
        s.style.background="url('"+deathCauseIcon(i)+"') "+pos+" / "+sz+" no-repeat, radial-gradient(circle at 50% 35%, rgba(48,34,58,.9), rgba(22,15,30,.95))"; }
      else if(isProtected(i)){ const rk=impKills[night]; const hit = rk && rk.type==="normal" && rk.target===i && rk.blocked;
        s.style.background=(hit?"url('assets/kp-demonkill.png') calc(50% + 6px) center / 60% no-repeat, ":"")+"url('assets/bg-shield.png') calc(50% + 6px) center / 78% no-repeat, radial-gradient(circle at 50% 35%, rgba(90,60,110,.9), rgba(45,28,60,.95))"; }
      const r=seatD/2, bD=Math.max(18, seatD*0.24)*1.1, dist=r*1.3;
      const badge=(deg,ic,t,scl,glow)=>{ const bd=bD*(scl||1); const a=deg*Math.PI/180, bx=r+dist*Math.sin(a), by=r-dist*Math.cos(a);
        const gf=glow?'filter:drop-shadow(0 0 2px '+glow+') drop-shadow(0 0 4px '+glow+');':'';
        return '<div class="shieldbadge" title="'+t+'" style="width:'+bd+'px;height:'+bd+'px;left:'+(bx-bd/2)+'px;top:'+(by-bd/2)+'px;'+gf+'"><img src="'+ic+'"></div>'; };
      const RA=[30,60,90,120,150];   // 右侧固定 5 等距槽位：骷髅/毒/酒/盾/弩
      [[dead,'assets/mk-dead.png','出局',1,'#000'],[m.poison,'assets/mk-poison.png','中毒',1,'#3fd44f'],[m.drunk,'assets/s-drunk.png','醉酒',1,'#ffe14d'],[isProtected(i)||m.mShield,'assets/mk-shield.png','守护/免疫',1,'#d8dae2'],[(m.role==="slayer"&&slayerShot)||m.mShot,'assets/mk-crossbow.png','猎人已开枪',1.2,'#4aa8ff']]
        .forEach((b,k)=>{ if(b[0]) html+=badge(RA[k],b[1],b[2],b[3],b[4]); });
      if(butlerPicks[night]===i) html+=badge(0,'assets/mk-master.png','管家的主人',1.1,'#f5c542');     // 正上方：王冠·金
      if(redHerring===i) html+=badge(180,'assets/mk-herring.png','红鲱鱼',1.2,'#ff4a3a');             // 正下方：红鲱鱼·红
      s.innerHTML=html;
      s.addEventListener("click",e=>{
        if(s._ct){ clearTimeout(s._ct); s._ct=null; openEditor(i); }
        else { s._ct=setTimeout(()=>{ s._ct=null; toggleBubble(i); }, 230); } });
      s.addEventListener("mouseenter",()=>showHover(i));
      s.addEventListener("mouseleave",hideHover);
      s.addEventListener("dragover",e=>{e.preventDefault();s.classList.add("over");});
      s.addEventListener("dragleave",()=>s.classList.remove("over"));
      s.addEventListener("drop",e=>{e.preventDefault();s.classList.remove("over");
        const d=e.dataTransfer.getData("text");
        if(d&&d.indexOf("role:")===0){ ensureMeta(); const rid=d.slice(5);
          if(rid==="drunk"){ const used=new Set(meta.map(m=>m.role).filter(Boolean));
            const pool=ROLES.filter(r=>r.team==="tf"&&!used.has(r.id)&&!lockedRoles.has(r.id)).map(r=>r.id);
            meta[i].role=pool.length?pool[Math.floor(Math.random()*pool.length)]:null; meta[i].isDrunk=true; meta[i].drunk=true; }
          else { meta[i].role=rid; meta[i].isDrunk=false; meta[i].drunk=false; }
          render(); }});
    }
    zone.appendChild(s);
  }
}
function showHover(i){
  if(view!=="grim") return;
  const box=document.getElementById("hoverBox"); const p=seatPos[i], m=meta[i];
  if(!p||!m||!m.role){ hideHover(); return; }
  const r=RMAP[m.role];
  let html='<div class="hb-role">'+(i+1)+' · '+(seatToken(i)?esc(seatToken(i).name):'')+' '+r.name+'</div>';
  html+='<div class="hb-ab"><span style="color:'+TEAMC[r.team]+'">【'+TEAMLABEL[r.team]+'】</span> '+r.ab+'</div>';
  const hist=m.hist||{}; const ns=Object.keys(hist).map(Number).sort((a,b)=>a-b);
  const TAGO=['evil','info','poison','poisoned','kill','protected','death','role']; const lines=[];
  ns.forEach(n=>{ let e=hist[n]; if(typeof e==="string") e={info:e};
    const parts=[]; TAGO.forEach(t=>{ if(e[t]) parts.push(e[t]); });
    if(parts.length) lines.push('<div class="hb-line"><span class="hb-n">第'+n+'夜</span>'+parts.join('；')+'</div>'); });
  if(lines.length) html+='<div class="hb-sep"></div>'+lines.join('');
  box.innerHTML=html;
  const c=tableCenter||{x:p.x,y:p.y};
  const SW=document.getElementById("stage").clientWidth;
  box.style.left=c.x+"px"; box.style.width=Math.round(Math.min(SW*0.22,260))+"px";
  if(checkWin()){ box.style.top=(c.y + SW*0.13 + 14)+"px"; box.style.transform="translate(-50%,0)"; }   // 胜利时移到图标下方
  else { box.style.top=c.y+"px"; box.style.transform="translate(-50%,-50%)"; }
  box.classList.add("on");
}
function hideHover(){ document.getElementById("hoverBox").classList.remove("on"); }
function toggleBubble(i){ if(openBubbles.has(i)) openBubbles.delete(i); else openBubbles.add(i); renderBubbles(); }
function renderBubbles(){
  const layer=document.getElementById("bubbleLayer"); layer.innerHTML="";
  if(view!=="grim") return;
  const stage=document.getElementById("stage"); const SW=stage.clientWidth;
  const BW=Math.round(Math.min(SW*0.24, 230));
  const c=tableCenter||{x:SW/2,y:stage.clientHeight/2};
  openBubbles.forEach(i=>{
    if(i>=N) return; const p=seatPos[i]; if(!p) return;
    const b=document.createElement("div"); b.style.width=BW+"px";
    const dx=p.x-c.x, dy=p.y-c.y, g=14; let cls;
    if(Math.abs(dx)>=Math.abs(dy)){
      if(dx<0){ cls="br"; b.style.left=(p.x+p.d/2+g)+"px"; b.style.top=p.y+"px"; b.style.transform="translateY(-50%)"; }
      else    { cls="bl"; b.style.left=(p.x-p.d/2-g)+"px"; b.style.top=p.y+"px"; b.style.transform="translate(-100%,-50%)"; }
    } else {
      if(dy<0){ cls="bb"; b.style.top=(p.y+p.d/2+g)+"px"; b.style.left=p.x+"px"; b.style.transform="translateX(-50%)"; }
      else    { cls="bt"; b.style.top=(p.y-p.d/2-g)+"px"; b.style.left=p.x+"px"; b.style.transform="translate(-50%,-100%)"; }
    }
    b.className="bubble "+cls;
    const t=seatToken(i); const nm=t?esc(t.name):('座位'+(i+1));
    b.innerHTML='<textarea placeholder="在此记录你自己的备注…"></textarea>';
    const ta=b.querySelector("textarea"); ta.value=meta[i]?(meta[i].info||""):"";
    ta.addEventListener("input",()=>{ ensureMeta(); meta[i].info=ta.value; save(); });
    ["click","mousedown","dblclick"].forEach(ev=>ta.addEventListener(ev,e=>e.stopPropagation()));
    layer.appendChild(b);
  });
}
function hl(i,on){ const seats=document.querySelectorAll(".seat"); const L=(i-1+N)%N,Rn=(i+1)%N;
  seats.forEach(s=>{ const j=+s.dataset.seat; if(on&&(j===L||j===Rn)) s.classList.add("nb"); else s.classList.remove("nb"); }); }

/* ---------- editor ---------- */
function openEditor(i){
  sel=i; ensureMeta(); const t=seatToken(i), m=meta[i];
  document.getElementById("mTitle").textContent="座位 "+(i+1);
  document.getElementById("mName").value=t?t.name:"";
  const selEl=document.getElementById("mRole");
  if(!selEl.dataset.built){ buildRoleSelect(selEl); selEl.dataset.built="1"; }
  selEl.value=m.role||"";
  document.getElementById("mDead").checked=!!(t&&t.dead);
  document.getElementById("mPoison").checked=!!m.poison;
  document.getElementById("mDrunk").checked=!!m.drunk;
  document.getElementById("mShield").checked=!!m.mShield;
  document.getElementById("mShot").checked=!!m.mShot;
  document.getElementById("mMaster").checked=(butlerPicks[night]===i);
  document.getElementById("mHerring").checked=(redHerring===i);
  document.getElementById("mNote").value=m.note||"";
  updAlign();
  document.getElementById("mask").classList.add("on");
}
function buildRoleSelect(sel){
  sel.innerHTML='<option value="">（未分配）</option>';
  ORDER.forEach(t=>{ const g=document.createElement("optgroup"); g.label=TEAMLABEL[t];
    ROLES.filter(r=>r.team===t).forEach(r=>{ const o=document.createElement("option"); o.value=r.id; o.textContent=r.name; g.appendChild(o); });
    sel.appendChild(g); });
}
function updAlign(){ const id=document.getElementById("mRole").value; const box=document.getElementById("mAlign");
  if(!id){ box.innerHTML=""; return; } const t=RMAP[id].team;
  box.innerHTML='<span class="align-badge '+(isEvil(t)?"evil":"good")+'">'+(isEvil(t)?"邪恶":"善良")+" · "+TEAMLABEL[t]+"</span>"; }
function applyEditor(){
  if(sel<0) return; const i=sel; const m=meta[i]; const name=document.getElementById("mName").value.trim();
  let t=seatToken(i);
  if(name){ if(t){ t.name=name; } else { t={id:++uid,name,seat:i,dead:false}; tokens.push(t); } if(!guests.includes(name)) guests.push(name); }
  m.role=document.getElementById("mRole").value||null;
  if(t) t.dead=document.getElementById("mDead").checked;
  m.poison=document.getElementById("mPoison").checked;
  m.drunk=document.getElementById("mDrunk").checked;
  m.mShield=document.getElementById("mShield").checked;
  m.mShot=document.getElementById("mShot").checked;
  if(document.getElementById("mMaster").checked) butlerPicks[night]=i;
  else if(butlerPicks[night]===i) delete butlerPicks[night];
  if(document.getElementById("mHerring").checked) redHerring=i;
  else if(redHerring===i) redHerring=-1;
  m.note=document.getElementById("mNote").value;
}
function closeEditor(){ applyEditor(); document.getElementById("mask").classList.remove("on"); sel=-1; render(); }
function clearSeatMeta(){ if(sel<0)return; meta[sel]=blankMeta(); const t=seatToken(sel); if(t)t.dead=false;
  document.getElementById("mask").classList.remove("on"); sel=-1; render(); }
document.getElementById("mRole").addEventListener("change",updAlign);
document.getElementById("mask").addEventListener("click",e=>{ if(e.target.id==="mask") closeEditor(); });

/* pool as drop target */
const poolEl=document.getElementById("pool");
poolEl.addEventListener("dragover",e=>{e.preventDefault();poolEl.classList.add("over");});
poolEl.addEventListener("dragleave",()=>poolEl.classList.remove("over"));
poolEl.addEventListener("drop",e=>{e.preventDefault();poolEl.classList.remove("over");
  const id=+e.dataTransfer.getData("text"); moveToken(id,null); selected=null; render();});

let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,80);});
load(); render();
</script>
